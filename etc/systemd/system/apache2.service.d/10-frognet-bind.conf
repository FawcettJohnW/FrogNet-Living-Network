# [APACHE_LAN_BIND_V1] Regenerate ports.conf before every apache2 start, so the
# listener follows the node's current FrogNet address instead of a value frozen
# at install time. See /usr/local/bin/frognet-apache-bind.sh for why the bind is
# address-specific rather than a bare "Listen 8080".
[Service]
ExecStartPre=/usr/local/bin/frognet-apache-bind.sh
