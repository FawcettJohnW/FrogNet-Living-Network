[Unit]
# [UNIT_AFTER_IS_ONE_LINE_V1] This was three lines, with
# NetworkManager-wait-online.service on its own with no Key=. systemd rejects a
# line with no '=' and logs it on every daemon-reload and every start:
#   /etc/systemd/system/dnsmasq.service.d/override.conf:N: Missing '=', ignoring line.
# The ordering dependency it was meant to express did not exist, so dnsmasq
# could start before NM had an address on the interface it binds.
Wants=network-online.target
After=network-online.target NetworkManager-wait-online.service

[Service]
Restart=on-failure
RestartSec=2
