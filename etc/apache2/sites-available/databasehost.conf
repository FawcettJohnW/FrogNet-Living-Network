<VirtualHost *:80>
    ServerName databasehost.frognet
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        # [APACHE_LAN_BIND_V1] was "Require all granted" with Indexes on.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require ip 10.0.0.0/8 127.0.0.1
    </Directory>
</VirtualHost>
