<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    # [NODE_LANDING_V1 - T5] the node's landing page is index.php (name, mode, build, links); Debian's own
    # /var/www/html/index.html (apache2's default page) stays the distribution's, unserved
    DirectoryIndex index.php
    ErrorLog syslog:local1
    CustomLog "|/usr/bin/logger -t apache2-access -p local1.info" combined
    # (no /semantic/ proxy: its backend, frognet-dashboard on :9100, is gone - T5)
    # [FDF_WEB_UNDER_APACHE_V1 - T5b] FD&F's region view (fdf_dashboard.html, getParticipants.php, waitParticipants.php,
    # chat) at /fdf/, from /opt/fdf/www/fdf, which the FD&F node .run lays down. Its PHP runs as www-data under
    # /opt/fdf/fdf.env, read on each request. A LAN-only node has no /opt/fdf: Apache refuses /fdf/ there (403, the path
    # falls under <Directory /> deny), and no page links it.
    Alias /fdf/ /opt/fdf/www/fdf/
    <Directory /opt/fdf/www/fdf>
        Options None
        AllowOverride None
        Require all granted
        DirectoryIndex fdf_dashboard.html
    </Directory>
    # [DC_APPS_V1] DisasterComm's add-ins (help requests, responders, hospital capacity, coordination) at /dc/, from
    # /opt/fdf/www/dc, beside /fdf/ and under the same fdf.env. Their held reads each keep an Apache worker for up to 25 s.
    Alias /dc/ /opt/fdf/www/dc/
    <Directory /opt/fdf/www/dc>
        Options None
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
</VirtualHost>
