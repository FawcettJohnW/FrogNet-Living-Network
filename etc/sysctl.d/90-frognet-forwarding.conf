# /etc/sysctl.d/90-frognet-forwarding.conf
#
# CRITICAL: These settings MUST persist across frognet-system-tune.sh runs.
# They live in a separate file (90-*) so that 99-frognet.conf (regenerated
# by system-tune) cannot overwrite them.
#
# Without these, the kernel silently drops all forwarded packets and
# reverse-path-filters tunnel traffic. Multi-hop routing (A→B→C→D)
# breaks completely.

# --- IPv4 forwarding (required for all multi-hop routing) ---
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1

# --- Disable reverse path filtering ---
# rp_filter=1 (strict) drops packets arriving on wg0 with source IPs
# that the FIB says should arrive via eth0. This kills asymmetric
# routing through WireGuard tunnels.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
