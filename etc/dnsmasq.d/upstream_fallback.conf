# [NO_DNS_FALLBACK_V1] No fallback. dnsmasq forwards to the next hop on the
# default route and to nobody else, per [DNS_NEXTHOP_ONLY_V1]. That next hop is
# the only content of resolv-file, which manageResolv / _write_dnsmasq_upstream
# maintains. dnsmasq polls its resolv-file on its own, so nothing signals it.
#
# no-resolv MUST NOT be set here: it disables resolv-file reading, which is what
# left this node forwarding to 8.8.8.8 while the merge wrote an upstream file
# nothing read. An empty resolv-file means no external DNS. FrogNet names still
# resolve locally. That is the correct behaviour for a node with no uplink.
resolv-file=/etc/sentinels/dnsmasq_upstream.conf
strict-order
address=/heartbeat.belkin.com/0.0.0.0
