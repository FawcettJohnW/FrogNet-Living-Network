<text x="210" y="262" font-family="&#39;IBM Plex Sans&#39;, system-ui, sans-serif" font-size="12.5" fill="#5d6a66" font-weight="400" text-anchor="start" font-style="italic">~16x lighter on the wire once the template is known</text>
