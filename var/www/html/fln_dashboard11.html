<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FrogNet Living Network</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#101826;
      --panel2:#0f1724;
      --line:#223047;
      --txt:#e6edf3;
      --muted:#9aa8b6;

      --semantic:#f7c948;
      --fast:#2bd576;
      --unknown:#6b7c93;

      --good:#2bd576;
      --ok:#f7c948;
      --bad:#ff5d5d;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;

      --dbglow: rgba(43,213,118,0.65);
      --dbglow2: rgba(43,213,118,0.35);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--txt);
      font-family:var(--sans);
      overflow:hidden;
    }

    header{
      height:64px;
      padding:10px 14px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:14px;
    }
    header .title{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    header h1{
      margin:0;
      font-size:28px;
      font-weight:700;
      letter-spacing:0.2px;
      line-height:1.05;
    }
    header .sub{
      color:var(--muted);
      font-size:12px;
      line-height:1.2;
    }

    header .controls{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .ctl{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:var(--muted);
    }
    .ctl select{
      background:var(--panel2);
      border:1px solid var(--line);
      color:var(--txt);
      border-radius:10px;
      padding:6px 8px;
      font-size:12px;
      outline:none;
      font-family:var(--mono);
    }
    .btn{
      background:var(--panel2);
      border:1px solid var(--line);
      color:var(--txt);
      border-radius:10px;
      padding:7px 10px;
      cursor:pointer;
      font-size:12px;
      user-select:none;
    }
    .btn:hover{ filter:brightness(1.07); }
    .btn:active{ transform: translateY(1px); }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--panel2);
      font-size:12px;
      color:var(--muted);
      max-width:620px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .layout{
      height: calc(100% - 64px);
      display:flex;
      min-height:0;
    }

    aside{
      width:480px;
      background:var(--panel);
      border-right:1px solid var(--line);
      padding:12px;
      overflow:auto;
    }

    .section{
      margin-bottom:12px;
      padding:10px;
      background:var(--panel2);
      border:1px solid var(--line);
      border-radius:14px;
    }
    .section h2{
      margin:0 0 8px 0;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:0.3px;
      text-transform:uppercase;
    }

    .tile{
      border:1px solid var(--line);
      background:#0c131f;
      border-radius:14px;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:10px;
    }
    .tile .row{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background:var(--unknown);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
      flex:0 0 auto;
    }
    .tile .name{
      font-weight:700;
      font-size:13px;
      color:var(--txt);
      flex:1 1 auto;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .tile .ip{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      flex:0 0 auto;
    }

    .mini{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tag{
      font-family:var(--mono);
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#0b0f14;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .tag:hover{ filter:brightness(1.08); }
    .tag strong{ color:var(--txt); font-weight:700; }

    .linkmeta{
      font-family:var(--mono);
      font-size:11px;
      color:var(--muted);
      line-height:1.35;
    }
    .linkmeta b{ color:var(--txt); font-weight:700; }

    main{
      flex:1 1 auto;
      position:relative;
      min-width:0;
      min-height:0;
    }
    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .hud{
      position:absolute;
      left:12px;
      bottom:12px;
      display:flex;
      gap:10px;
      align-items:center;
      pointer-events:none;
    }
    .hud .pill{ pointer-events:none; }

    /* Cache Performance Styles */
    .cache-hero{
      display:flex;
      gap:12px;
      margin-bottom:10px;
    }
    .cache-stat{
      flex:1;
      background:#0c131f;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      text-align:center;
    }
    .cache-stat .value{
      font-size:24px;
      font-weight:700;
      color:var(--good);
      font-family:var(--mono);
    }
    .cache-stat .value.warn{ color:var(--ok); }
    .cache-stat .value.bad{ color:var(--bad); }
    .cache-stat .label{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
      text-transform:uppercase;
      letter-spacing:0.3px;
    }

    .cache-bar-container{
      background:#0c131f;
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px;
      margin-bottom:10px;
    }
    .cache-bar-label{
      font-size:11px;
      color:var(--muted);
      margin-bottom:6px;
      display:flex;
      justify-content:space-between;
    }
    .cache-bar{
      height:20px;
      background:#1a2332;
      border-radius:6px;
      overflow:hidden;
      display:flex;
    }
    .cache-bar .same{
      background:var(--good);
      height:100%;
      transition:width 0.3s ease;
    }
    .cache-bar .diff{
      background:var(--ok);
      height:100%;
      transition:width 0.3s ease;
    }
    .cache-bar .miss{
      background:var(--bad);
      height:100%;
      transition:width 0.3s ease;
    }
    .cache-bar .raw{
      background:var(--unknown);
      height:100%;
      transition:width 0.3s ease;
    }

    .cache-legend{
      display:flex;
      gap:12px;
      margin-top:8px;
      font-size:10px;
      color:var(--muted);
    }
    .cache-legend span{
      display:flex;
      align-items:center;
      gap:4px;
    }
    .cache-legend .dot{
      width:8px;
      height:8px;
    }

    .peer-cache-tile{
      border:1px solid var(--line);
      background:#0c131f;
      border-radius:10px;
      padding:10px;
      margin-bottom:8px;
    }
    .peer-cache-tile .peer-header{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
    }
    .peer-cache-tile .peer-name{
      font-weight:700;
      font-size:12px;
      flex:1;
    }
    .peer-cache-tile .peer-stats{
      display:flex;
      gap:12px;
      font-family:var(--mono);
      font-size:11px;
      color:var(--muted);
    }
    .peer-cache-tile .peer-stats b{
      color:var(--txt);
    }
    .peer-cache-tile .mini-bar{
      height:6px;
      background:#1a2332;
      border-radius:3px;
      overflow:hidden;
      display:flex;
    }

    .endpoint-row{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 0;
      border-bottom:1px solid var(--line);
      font-size:11px;
    }
    .endpoint-row:last-child{ border-bottom:none; }
    .endpoint-row .path{
      flex:1;
      font-family:var(--mono);
      color:var(--txt);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .endpoint-row .saved{
      font-family:var(--mono);
      color:var(--good);
      font-weight:700;
    }
    .endpoint-row .hits{
      color:var(--muted);
      font-family:var(--mono);
    }

    /* Modal */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .modal{
      width:min(980px, 96vw);
      max-height: 90vh;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .modal header{
      height:auto;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .modal header .m-title{
      font-size:13px;
      font-weight:700;
      color:var(--txt);
      flex:1;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .modal header .m-close{
      flex:0 0 auto;
    }
    pre{
      margin:0;
      padding:12px;
      background:#0b0f14;
      color:var(--txt);
      overflow:auto;
      font-family:var(--mono);
      font-size:12px;
      line-height:1.35;
      white-space:pre-wrap;
      word-break:break-word;
      flex:1 1 auto;
    }
  </style>
</head>

<body>
<header>
  <div class="title">
    <h1>FrogNet Living Network</h1>
    <div class="sub">
      SAME/DIFF semantic caching enabled. Lines colored by node owner. Semantic arrowhead is yellow.
    </div>
  </div>

  <div class="controls">
    <div class="ctl">
      <span>Poll</span>
      <select id="pollSec">
        <option value="1">1s</option>
        <option value="2" selected>2s</option>
        <option value="5">5s</option>
        <option value="10">10s</option>
      </select>
    </div>
    <button class="btn" id="btnFit">Fit</button>
    <button class="btn" id="btnRefresh">Refresh</button>
    <div class="pill" id="status">—</div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="section" id="cacheSection">
      <h2>Cache Performance</h2>
      <div id="cacheTiles">
        <div class="linkmeta">Loading cache metrics...</div>
      </div>
    </div>

    <div class="section">
      <h2>Network Links</h2>
      <div id="linkTiles"></div>
    </div>

    <div class="section">
      <h2>Hosts</h2>
      <div id="hostTiles"></div>
    </div>
  </aside>

  <main>
    <canvas id="net"></canvas>
    <div class="hud">
      <div class="pill" id="hud">—</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <header>
      <div class="m-title" id="modalTitle">—</div>
      <button class="btn m-close" id="modalClose">Close</button>
    </header>
    <pre id="modalBody"></pre>
  </div>
</div>

<script>
/**********************************************************************
 * Helpers
 **********************************************************************/
function isV4(s){ return typeof s === "string" && /^\d+\.\d+\.\d+\.\d+$/.test(s); }
function isFrogNetIp(ip){ return typeof ip === "string" && ip.startsWith("10."); }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

async function jget(url){
  const r = await fetch(url, { cache:"no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
  return await r.json();
}
async function jgetTry(urls){
  let lastErr = null;
  for (const u of urls){
    try { return await jget(u); } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("all fetch variants failed");
}

function parseEcho(echoStr){
  if (typeof echoStr !== "string") return { fqdn:"", hostPath:"", gw0:"", gw1:"" };
  const parts = echoStr.trim().split(",");
  return {
    fqdn: (parts[0]||"").trim(),
    hostPath: (parts[1]||"").trim(),
    gw0: (parts[2]||"").trim(),
    gw1: (parts[3]||"").trim(),
  };
}

function canonicalKey(a,b){ return [a,b].sort().join("|"); }

function subnetThird(ip){
  if (!isV4(ip)) return null;
  const p = ip.split(".");
  return p[2] ? Number(p[2]) : null;
}

function safeJsonParse(v){
  if (v === null || v === undefined) return null;
  if (typeof v === "object") return v;
  if (typeof v !== "string") return null;
  try { return JSON.parse(v); } catch { return null; }
}

function formatBytes(bytes){
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  if (bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + " MB";
  return (bytes/(1024*1024*1024)).toFixed(2) + " GB";
}

function formatPct(ratio){
  return (ratio * 100).toFixed(1) + "%";
}

/**********************************************************************
 * LinkState normalization
 **********************************************************************/
function normalizeEdgesFromLinkStateJson(obj){
  if (!obj || typeof obj !== "object") return [];
  if (Array.isArray(obj.edges)) return obj.edges;
  if (obj.peer_host_ip) return [obj];
  return [];
}

/**********************************************************************
 * Deterministic per-node color
 **********************************************************************/
let NODE_COLOR_MAP = new Map();
function hashStr(s){
  let h=2166136261;
  for (let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h>>>0);
}
function hueDist(a, b){
  const d = Math.abs(a - b) % 360;
  return Math.min(d, 360 - d);
}
function computeUniqueNodeColors(nodeIds){
  const out = new Map();
  const ids = Array.from(nodeIds)
    .map(id => String(id ?? "").trim())
    .filter(id => id && !id.startsWith("external:"))
    .sort();

  const MIN_GAP_DEG = 20;
  const chosenHues = [];
  for (const id of ids){
    const base = hashStr(id) % 360;
    let h = base;
    let picked = null;
    const STEP = 37;
    for (let tries = 0; tries < 360; tries++){
      let ok = true;
      for (const hh of chosenHues){
        if (hueDist(h, hh) < MIN_GAP_DEG){ ok = false; break; }
      }
      if (ok){ picked = h; break; }
      h = (h + STEP) % 360;
    }
    if (picked === null) picked = base;
    chosenHues.push(picked);
    out.set(id, `hsl(${picked} 68% 54%)`);
  }
  for (const raw of nodeIds){
    const id = String(raw ?? "").trim();
    if (id.startsWith("external:")) out.set(id, "hsl(0 0% 92%)");
  }
  return out;
}
function assignColorIfMissing(id){
  const k = String(id ?? "").trim();
  if (!k) return "hsl(0 0% 60%)";
  if (k.startsWith("external:")) {
    NODE_COLOR_MAP.set(k, "hsl(0 0% 92%)");
    return NODE_COLOR_MAP.get(k);
  }
  if (NODE_COLOR_MAP.has(k)) return NODE_COLOR_MAP.get(k);

  const used = new Set(NODE_COLOR_MAP.values());
  const base = hashStr(k) % 360;
  const L_LANES = [54, 46, 62, 40, 68];
  let h = base;
  for (let lane = 0; lane < L_LANES.length; lane++){
    const l = L_LANES[lane];
    for (let tries = 0; tries < 360; tries++){
      const cand = `hsl(${h} 68% ${l}%)`;
      if (!used.has(cand)){
        NODE_COLOR_MAP.set(k, cand);
        return cand;
      }
      h = (h + 37) % 360;
    }
  }
  const cand = `hsl(${base} 68% 54%)`;
  NODE_COLOR_MAP.set(k, cand);
  return cand;
}
function idNorm(id){ return String(id ?? "").trim(); }
function nodeColorForId(id){ return assignColorIfMissing(id); }

function parseHsl(css){
  const m = String(css||"").match(/hsl\(\s*([0-9.]+)\s+([0-9.]+)%\s+([0-9.]+)%\s*\)/i);
  if (!m) return null;
  return { h: Number(m[1]), s: Number(m[2]), l: Number(m[3]) };
}
function hslToRgb(h, s, l){
  h = ((h%360)+360)%360; s/=100; l/=100;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs(((h/60) % 2) - 1));
  const m = l - c/2;
  let r=0,g=0,b=0;
  if (0<=h && h<60){ r=c; g=x; b=0; }
  else if (60<=h && h<120){ r=x; g=c; b=0; }
  else if (120<=h && h<180){ r=0; g=c; b=x; }
  else if (180<=h && h<240){ r=0; g=x; b=c; }
  else if (240<=h && h<300){ r=x; g=0; b=c; }
  else { r=c; g=0; b=x; }
  return { r: Math.round((r+m)*255), g: Math.round((g+m)*255), b: Math.round((b+m)*255) };
}
function relLuma(rgb){
  function lin(u){
    u /= 255;
    return (u <= 0.04045) ? (u/12.92) : Math.pow((u+0.055)/1.055, 2.4);
  }
  const R = lin(rgb.r), G = lin(rgb.g), B = lin(rgb.b);
  return 0.2126*R + 0.7152*G + 0.0722*B;
}
function bestTextColorForFill(fillCss){
  const hsl = parseHsl(fillCss);
  if (!hsl) return "#0b0f14";
  const rgb = hslToRgb(hsl.h, hsl.s, hsl.l);
  const L = relLuma(rgb);
  return (L > 0.45) ? "#0b0f14" : "#e6edf3";
}

/**********************************************************************
 * Modal
 **********************************************************************/
const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody  = document.getElementById("modalBody");
document.getElementById("modalClose").onclick = () => { modalBackdrop.style.display="none"; };
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) modalBackdrop.style.display="none"; });
function showModal(title, obj){
  modalTitle.textContent = title;
  modalBody.textContent = (typeof obj === "string") ? obj : JSON.stringify(obj, null, 2);
  modalBackdrop.style.display = "flex";
}

/**********************************************************************
 * Canvas HiDPI sizing
 **********************************************************************/
const canvas = document.getElementById("net");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width  = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/**********************************************************************
 * View transform
 **********************************************************************/
let view = { x: 0, y: 0, k: 1.0 };
function worldToScreen(p){ return { x: p.x*view.k + view.x, y: p.y*view.k + view.y }; }
function screenToWorld(p){ return { x: (p.x - view.x)/view.k, y: (p.y - view.y)/view.k }; }

function fitToScreen(nodes){
  const rect = canvas.getBoundingClientRect();
  const sw = rect.width, sh = rect.height;
  const arr = Array.from(nodes.values());
  if (!arr.length) return;

  let minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
  for (const n of arr){
    minx = Math.min(minx, n.x);
    miny = Math.min(miny, n.y);
    maxx = Math.max(maxx, n.x);
    maxy = Math.max(maxy, n.y);
  }

  const pad = 160;
  minx -= pad; miny -= pad; maxx += pad; maxy += pad;

  const w = Math.max(1, maxx - minx);
  const h = Math.max(1, maxy - miny);

  const k = Math.min(sw / w, sh / h, 1.6);
  view.k = Math.max(0.25, k);

  const cx = (minx + maxx)/2;
  const cy = (miny + maxy)/2;
  view.x = sw/2 - cx*view.k;
  view.y = sh/2 - cy*view.k;
}

/**********************************************************************
 * Persistent positions
 **********************************************************************/
const POS_KEY = "frognet_livingnet_positions_v8";
function loadPositions(){ try { return JSON.parse(localStorage.getItem(POS_KEY)||"{}") || {}; } catch(e){ return {}; } }
function savePositions(pos){ try { localStorage.setItem(POS_KEY, JSON.stringify(pos)); } catch(e){} }
function seeded01(s){ return (hashStr(s) % 1000000) / 1000000; }

/**********************************************************************
 * State
 **********************************************************************/
const EDGE_W = 3.0;
let HOSTS = new Map();
let SENSORS = [];
let SENSOR_BY_HOSTIP = new Map();
let SENSOR_DATA_CACHE = new Map();

let NODES = new Map();
let EDGES = new Map();
let PHYS_LINKS = new Map();
let LINK_QUALITY = new Map();
let SUBNET_EDGES = new Map();

let DBHOST_IP = "";

// Cache performance data
let CACHE_DATA = null;
let CACHE_BY_HOST = new Map();

/**********************************************************************
 * Node box sizing
 **********************************************************************/
function computeNodeBox(label, ip){
  const padX = 14;
  const padY = 10;
  ctx.save();
  ctx.font = `13px ${getCss("--sans")}`;
  const w1 = ctx.measureText(label || "").width;
  ctx.font = `12px ${getCss("--mono")}`;
  const w2 = ctx.measureText(ip || "").width;
  ctx.restore();
  const w = Math.max(120, Math.ceil(Math.max(w1, w2) + padX*2));
  const h = 52 + padY;
  return { w, h };
}

function ensureNode(id, label, ipForSort){
  id = idNorm(id);
  ipForSort = idNorm(ipForSort);
  if (!NODES.has(id)){
    const posStore = loadPositions();
    const rect = canvas.getBoundingClientRect();
    const wv = rect.width, hv = rect.height;

    let x, y;
    if (posStore[id] && typeof posStore[id].x === "number" && typeof posStore[id].y === "number"){
      x = posStore[id].x; y = posStore[id].y;
    } else {
      let col = 0.50;
      if (ipForSort && ipForSort.startsWith("10.101.")){
        const p = ipForSort.split(".");
        const third = Number(p[2]||0);
        col = (third === 10) ? 0.22 : (third === 20 ? 0.36 : (third === 30 ? 0.50 : (third === 50 ? 0.68 : 0.82)));
      }
      if (id.startsWith("external:")) col = 0.92;
      x = wv * col + (seeded01(id)-0.5)*90;
      y = hv * (0.22 + 0.60*seeded01("y:"+id));
      posStore[id] = { x, y };
      savePositions(posStore);
    }

    const box = computeNodeBox(label||id, ipForSort||"");
    NODES.set(id, { id, label: label||id, ip: ipForSort||"", x, y, w: box.w, h: box.h });
  } else {
    const n = NODES.get(id);
    if (label && n.label !== label) n.label = label;
    if (ipForSort && !n.ip) n.ip = ipForSort;
    const box = computeNodeBox(n.label, n.ip);
    n.w = box.w; n.h = box.h;
  }
  return NODES.get(id);
}

function rectOf(n, pad=18){
  return {
    x0: n.x - n.w/2 - pad,
    y0: n.y - n.h/2 - pad,
    x1: n.x + n.w/2 + pad,
    y1: n.y + n.h/2 + pad
  };
}
function rectsOverlap(a,b){
  return !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1);
}
function resolveOverlaps(iter=70){
  const nodes = Array.from(NODES.values());
  if (nodes.length < 2) return;

  for (let k=0;k<iter;k++){
    let moved = false;
    for (let i=0;i<nodes.length;i++){
      for (let j=i+1;j<nodes.length;j++){
        const A = nodes[i], B = nodes[j];
        const ra = rectOf(A, 18);
        const rb = rectOf(B, 18);
        if (!rectsOverlap(ra, rb)) continue;

        const dx = (A.x - B.x) || ((seeded01("dx:"+A.id+"|"+B.id)-0.5) * 0.01);
        const dy = (A.y - B.y) || ((seeded01("dy:"+A.id+"|"+B.id)-0.5) * 0.01);

        const overlapX = Math.min(ra.x1, rb.x1) - Math.max(ra.x0, rb.x0);
        const overlapY = Math.min(ra.y1, rb.y1) - Math.max(ra.y0, rb.y0);

        if (overlapX < overlapY){
          const push = (overlapX/2 + 3) * Math.sign(dx);
          A.x += push; B.x -= push;
        } else {
          const push = (overlapY/2 + 3) * Math.sign(dy);
          A.y += push; B.y -= push;
        }
        moved = true;
      }
    }
    if (!moved) break;
  }
}

function intersectRectBoundary(fromNode, toNode){
  const fx = fromNode.x, fy = fromNode.y;
  const tx = toNode.x,   ty = toNode.y;
  const dx = tx - fx;
  const dy = ty - fy;
  const hw = fromNode.w/2;
  const hh = fromNode.h/2;

  if (dx === 0 && dy === 0) return { x: fx, y: fy };

  const sx = (dx !== 0) ? (hw / Math.abs(dx)) : Infinity;
  const sy = (dy !== 0) ? (hh / Math.abs(dy)) : Infinity;
  const t = Math.min(sx, sy);

  return { x: fx + dx * t, y: fy + dy * t };
}

function segmentIntersectsRect(p0, p1, r){
  const minx = Math.min(p0.x,p1.x), maxx = Math.max(p0.x,p1.x);
  const miny = Math.min(p0.y,p1.y), maxy = Math.max(p0.y,p1.y);
  if (maxx < r.x0 || minx > r.x1 || maxy < r.y0 || miny > r.y1) return false;

  const steps = 18;
  for (let i=0;i<=steps;i++){
    const t = i/steps;
    const x = p0.x + (p1.x - p0.x)*t;
    const y = p0.y + (p1.y - p0.y)*t;
    if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) return true;
  }
  return false;
}

function edgeCurvePoints(a, b){
  const pA = intersectRectBoundary(a, b);
  const pB = intersectRectBoundary(b, a);

  const mx = (pA.x + pB.x)/2;
  const my = (pA.y + pB.y)/2;
  const dx = pB.x - pA.x;
  const dy = pB.y - pA.y;
  const len = Math.max(1, Math.hypot(dx,dy));
  const nx = -dy/len;
  const ny =  dx/len;

  const side = (hashStr(a.id + "->" + b.id) & 1) ? 1 : -1;

  let bend = 26;
  for (let tries=0; tries<10; tries++){
    const c = { x: mx + nx * bend * side, y: my + ny * bend * side };

    let blocked = false;
    for (const n of NODES.values()){
      if (n.id === a.id || n.id === b.id) continue;
      const r = rectOf(n, 10);
      if (segmentIntersectsRect(pA, c, r) || segmentIntersectsRect(c, pB, r) || segmentIntersectsRect(pA, pB, r)){
        blocked = true;
        break;
      }
    }

    if (!blocked) return { pA, pB, c };
    bend += 22;
  }

  return { pA, pB, c: { x: mx + nx * 160 * side, y: my + ny * 160 * side } };
}

/**********************************************************************
 * Draw helpers
 **********************************************************************/
function edgeStrokeColor(e){
  if (!e || !e.from) return getCss("--unknown");
  return nodeColorForId(e.from);
}
function edgeDash(e){
  if (!e) return [];
  if (e.kind === "SEMANTIC") return [18, 10];
  const dev = (e.meta && typeof e.meta.dev === "string") ? e.meta.dev.toLowerCase() : "";
  if (e.kind === "EXTERNAL") return [12, 7];
  if (dev.includes("wlan1")) return [10, 4, 2, 4, 10, 4];
  if (dev.includes("wlan0")) return [];
  return [6, 8];
}
function arrowColor(e, lineCol){
  if (!e) return lineCol;
  if (e.kind === "SEMANTIC") return getCss("--semantic");
  return lineCol;
}
function drawRoundedRect(x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
}

function draw(){
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);

  const arrowHeads = [];

  for (const e of EDGES.values()){
    const a = NODES.get(e.from);
    const b = NODES.get(e.to);
    if (!a || !b) continue;

    const { pA, pB, c } = edgeCurvePoints(a, b);
    const A = worldToScreen(pA);
    const B = worldToScreen(pB);
    const C = worldToScreen(c);

    const col = edgeStrokeColor(e);

    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = EDGE_W;
    ctx.globalAlpha = (e.kind === "UNKNOWN") ? 0.45 : 0.92;
    ctx.setLineDash(edgeDash(e));
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.quadraticCurveTo(C.x, C.y, B.x, B.y);
    ctx.stroke();
    ctx.restore();

    if (e.kind === "SEMANTIC"){
      const tx = B.x - C.x;
      const ty = B.y - C.y;
      const ang = Math.atan2(ty, tx);
      arrowHeads.push({ bx: B.x, by: B.y, ang, col: arrowColor(e, col) });
    }
  }

  for (const n of NODES.values()){
    const P = worldToScreen(n);
    const w = n.w * view.k;
    const h = n.h * view.k;
    const x = P.x - w/2;
    const y = P.y - h/2;

    const isExternal = n.id.startsWith("external:");
    const isDb = (!isExternal && DBHOST_IP && n.id === DBHOST_IP);

    const fill = isExternal ? "rgba(230,237,243,0.96)" : nodeColorForId(n.id);
    const txtCol = isExternal ? "#0b0f14" : bestTextColorForFill(fill);

    ctx.save();
    if (isDb){
      ctx.shadowColor = getCss("--dbglow");
      ctx.shadowBlur = 26;
    }

    drawRoundedRect(x, y, w, h, 14*view.k);
    ctx.fillStyle = fill;
    ctx.globalAlpha = 1.0;
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(11,15,20,0.65)";
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.95;
    ctx.stroke();

    if (isDb){
      ctx.strokeStyle = getCss("--dbglow2");
      ctx.lineWidth = 10;
      ctx.globalAlpha = 0.75;
      ctx.stroke();
    }

    const label = n.label || n.id;
    const ip = isExternal ? "Internet" : (n.ip || "");

    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = txtCol;
    ctx.font = `13px ${getCss("--sans")}`;
    ctx.fillText(label, P.x, P.y - 8);

    ctx.fillStyle = txtCol;
    ctx.globalAlpha = 0.90;
    ctx.font = `12px ${getCss("--mono")}`;
    ctx.fillText(ip, P.x, P.y + 14);

    ctx.restore();
  }

  for (const h of arrowHeads){
    const { bx, by, ang, col } = h;
    const pullback = 16;
    const hx = bx - Math.cos(ang) * pullback;
    const hy = by - Math.sin(ang) * pullback;
    const head = 11;

    ctx.save();
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.97;
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx - head*Math.cos(ang - Math.PI/6), hy - head*Math.sin(ang - Math.PI/6));
    ctx.lineTo(hx - head*Math.cos(ang + Math.PI/6), hy - head*Math.sin(ang + Math.PI/6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

/**********************************************************************
 * Interaction
 **********************************************************************/
let dragging = { mode:"none", id:"", start:{x:0,y:0}, view0:{x:0,y:0,k:1} };

function hitTestNode(worldPt){
  for (const n of NODES.values()){
    const x0 = n.x - (n.w/2);
    const y0 = n.y - (n.h/2);
    const x1 = n.x + (n.w/2);
    const y1 = n.y + (n.h/2);
    if (worldPt.x >= x0 && worldPt.x <= x1 && worldPt.y >= y0 && worldPt.y <= y1) return n;
  }
  return null;
}

canvas.addEventListener("mousedown", (ev) => {
  const rect = canvas.getBoundingClientRect();
  const p = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  const w = screenToWorld(p);

  const hit = hitTestNode(w);
  if (hit){
    dragging.mode = "node";
    dragging.id = hit.id;
  } else {
    dragging.mode = "pan";
    dragging.view0 = { x: view.x, y: view.y, k: view.k };
    dragging.start = p;
  }
});

window.addEventListener("mouseup", () => {
  if (dragging.mode === "node"){
    const n = NODES.get(dragging.id);
    if (n){
      const posStore = loadPositions();
      posStore[n.id] = { x: n.x, y: n.y };
      savePositions(posStore);
    }
  }
  dragging.mode = "none";
  dragging.id = "";
});

window.addEventListener("mousemove", (ev) => {
  if (dragging.mode === "none") return;

  const rect = canvas.getBoundingClientRect();
  const p = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };

  if (dragging.mode === "pan"){
    const dx = p.x - dragging.start.x;
    const dy = p.y - dragging.start.y;
    view.x = dragging.view0.x + dx;
    view.y = dragging.view0.y + dy;
    draw();
    return;
  }

  if (dragging.mode === "node"){
    const n = NODES.get(dragging.id);
    if (!n) return;
    const w = screenToWorld(p);
    n.x = w.x;
    n.y = w.y;
    draw();
  }
});

canvas.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const p = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  const before = screenToWorld(p);

  const delta = Math.sign(ev.deltaY);
  const factor = (delta > 0) ? 0.90 : 1.11;
  view.k = Math.max(0.25, Math.min(2.5, view.k * factor));

  const after = screenToWorld(p);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;

  draw();
}, { passive:false });

 * Data acquisition
 **********************************************************************/
async function fetchSensors(){
  const j = await jgetTry([
    "/frognet_api/api.php?entity=sensors&limit=5000",
    "/frognet_api/api.php?entity=sensors&action=list&limit=5000"
  ]);
  if (!j || !Array.isArray(j.rows)) throw new Error("sensors API returned unexpected shape");
  return j.rows;
}

async function fetchSensorData(sensorId){
  if (SENSOR_DATA_CACHE.has(sensorId)) return SENSOR_DATA_CACHE.get(sensorId);

  const j = await jgetTry([
    `/frognet_api/api.php?entity=sensor_data&SensorID=${encodeURIComponent(sensorId)}&limit=1`,
    `/frognet_api/api.php?entity=sensor_data&action=get&SensorID=${encodeURIComponent(sensorId)}`
  ]);

  let raw = null;
  if (j && Array.isArray(j.rows) && j.rows[0]) raw = j.rows[0].jsonData;
  else if (j && j.row && typeof j.row === "object") raw = j.row.jsonData;

  const obj = safeJsonParse(raw);
  SENSOR_DATA_CACHE.set(sensorId, obj);
  return obj;
}

/**********************************************************************
 * Cache Performance rendering
 **********************************************************************/
function renderCacheTiles(){
  const el = document.getElementById("cacheTiles");
  
  // Aggregate all cache sensors
  let aggregated = {
    same: 0, diff: 0, miss: 0, raw: 0,
    bytes_would: 0, bytes_actual: 0, bytes_saved: 0,
    total_requests: 0, cache_hit_rate: 0,
    rtt_avg_ms: 0, rtt_p95_ms: 0,
    by_peer: {},
    top_endpoints: []
  };
  
  let hasCacheData = false;
  
  for (const [hostIp, data] of CACHE_BY_HOST.entries()){
    if (!data || !data.totals) continue;
    hasCacheData = true;
    const t = data.totals;
    
    // v4.1: read from structured response_types / request_types
    const rt = t.response_types || {};
    aggregated.same += rt.RESP_SAME || 0;
    aggregated.diff += rt.RESP_DIFF || 0;
    aggregated.miss += rt.REQ_MISS || 0;
    aggregated.raw  += rt.RESP_RAW || 0;
    aggregated.bytes_would += t.bytes_would || 0;
    aggregated.bytes_actual += t.bytes_actual || 0;
    aggregated.bytes_saved += t.bytes_saved || 0;
    aggregated.total_requests += t.total_requests || 0;
    
    // Merge by_peer
    if (data.by_peer){
      for (const [peer, pstats] of Object.entries(data.by_peer)){
        const prt = pstats.response_types || {};
        if (!aggregated.by_peer[peer]){
          aggregated.by_peer[peer] = {
            same: prt.RESP_SAME || 0,
            diff: prt.RESP_DIFF || 0,
            miss: prt.REQ_MISS || 0,
            bytes_saved: pstats.bytes_saved || 0,
            rtt_avg_ms: (pstats.rtt && pstats.rtt.avg_ms) || 0,
            source_host: hostIp
          };
        } else {
          const p = aggregated.by_peer[peer];
          p.same = (p.same||0) + (prt.RESP_SAME||0);
          p.diff = (p.diff||0) + (prt.RESP_DIFF||0);
          p.miss = (p.miss||0) + (prt.REQ_MISS||0);
          p.bytes_saved = (p.bytes_saved||0) + (pstats.bytes_saved||0);
        }
      }
    }
    
    // Merge top_endpoints
    if (data.top_endpoints){
      aggregated.top_endpoints.push(...data.top_endpoints);
    }
  }
  
  // Dedupe and sort endpoints
  const epMap = new Map();
  for (const ep of aggregated.top_endpoints){
    const key = ep.path;
    const eprt = ep.response_types || {};
    if (!epMap.has(key)){
      epMap.set(key, { path: ep.path, same: eprt.RESP_SAME||0, diff: eprt.RESP_DIFF||0, bytes_saved: ep.bytes_saved||0 });
    } else {
      const e = epMap.get(key);
      e.same += eprt.RESP_SAME || 0;
      e.diff += eprt.RESP_DIFF || 0;
      e.bytes_saved += ep.bytes_saved || 0;
    }
  }
  aggregated.top_endpoints = Array.from(epMap.values())
    .sort((a,b) => (b.bytes_saved||0) - (a.bytes_saved||0))
    .slice(0, 10);
  
  // Calculate rates
  aggregated.cache_hit_rate = aggregated.total_requests > 0 
    ? aggregated.same / aggregated.total_requests 
    : 0;
  
  if (!hasCacheData){
    el.innerHTML = `<div class="linkmeta">No cache metrics found. Deploy the updated proxy/daemon with metrics enabled.</div>`;
    return;
  }
  
  // Build HTML
  let html = '';
  
  // Hero stats
  const savedPct = aggregated.bytes_would > 0 
    ? ((aggregated.bytes_saved / aggregated.bytes_would) * 100).toFixed(1) 
    : 0;
  const hitRatePct = (aggregated.cache_hit_rate * 100).toFixed(1);
  
  html += `
    <div class="cache-hero">
      <div class="cache-stat">
        <div class="value ${savedPct > 50 ? '' : savedPct > 20 ? 'warn' : 'bad'}">${savedPct}%</div>
        <div class="label">Bandwidth Saved</div>
      </div>
      <div class="cache-stat">
        <div class="value ${hitRatePct > 70 ? '' : hitRatePct > 40 ? 'warn' : 'bad'}">${hitRatePct}%</div>
        <div class="label">Cache Hit Rate</div>
      </div>
      <div class="cache-stat">
        <div class="value">${formatBytes(aggregated.bytes_saved)}</div>
        <div class="label">Total Saved</div>
      </div>
    </div>
  `;
  
  // Request breakdown bar
  const total = aggregated.same + aggregated.diff + aggregated.miss + aggregated.raw;
  const samePct = total > 0 ? (aggregated.same / total * 100) : 0;
  const diffPct = total > 0 ? (aggregated.diff / total * 100) : 0;
  const missPct = total > 0 ? (aggregated.miss / total * 100) : 0;
  const rawPct = total > 0 ? (aggregated.raw / total * 100) : 0;
  
  html += `
    <div class="cache-bar-container">
      <div class="cache-bar-label">
        <span>Request Outcomes</span>
        <span>${total.toLocaleString()} requests</span>
      </div>
      <div class="cache-bar">
        <div class="same" style="width:${samePct}%" title="SAME: ${aggregated.same}"></div>
        <div class="diff" style="width:${diffPct}%" title="DIFF: ${aggregated.diff}"></div>
        <div class="miss" style="width:${missPct}%" title="MISS: ${aggregated.miss}"></div>
        <div class="raw" style="width:${rawPct}%" title="RAW (uncached): ${aggregated.raw}"></div>
      </div>
      <div class="cache-legend">
        <span><div class="dot" style="background:var(--good)"></div> SAME (${aggregated.same.toLocaleString()})</span>
        <span><div class="dot" style="background:var(--ok)"></div> DIFF (${aggregated.diff.toLocaleString()})</span>
        <span><div class="dot" style="background:var(--bad)"></div> MISS (${aggregated.miss.toLocaleString()})</span>
      </div>
    </div>
  `;
  
  // Per-peer breakdown
  const peers = Object.entries(aggregated.by_peer).sort((a,b) => (b[1].bytes_saved||0) - (a[1].bytes_saved||0));
  
  if (peers.length > 0){
    html += `<div style="font-size:11px;color:var(--muted);margin:8px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">By Peer</div>`;
    
    for (const [peer, stats] of peers.slice(0, 6)){
      const peerTotal = (stats.same||0) + (stats.diff||0) + (stats.miss||0);
      const peerSame = stats.same||0;
      const peerDiff = stats.diff||0;
      const peerSamePct = peerTotal > 0 ? (peerSame / peerTotal * 100) : 0;
      const peerDiffPct = peerTotal > 0 ? (peerDiff / peerTotal * 100) : 0;
      const peerMissPct = peerTotal > 0 ? ((stats.miss||0) / peerTotal * 100) : 0;
      
      const peerName = HOSTS.has(peer) ? HOSTS.get(peer).hostname : peer;
      
      html += `
        <div class="peer-cache-tile">
          <div class="peer-header">
            <div class="dot" style="background:${nodeColorForId(peer)}"></div>
            <div class="peer-name">${peerName}</div>
            <div class="peer-stats">
              <span><b>${formatBytes(stats.bytes_saved||0)}</b> saved</span>
              <span>RTT <b>${(stats.rtt_avg_ms||0).toFixed(1)}ms</b></span>
            </div>
          </div>
          <div class="mini-bar">
            <div class="same" style="width:${peerSamePct}%"></div>
            <div class="diff" style="width:${peerDiffPct}%"></div>
            <div class="miss" style="width:${peerMissPct}%"></div>
          </div>
        </div>
      `;
    }
  }
  
  // Top endpoints
  if (aggregated.top_endpoints.length > 0){
    html += `<div style="font-size:11px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">Top Endpoints by Savings</div>`;
    html += `<div class="tile" style="padding:8px;">`;
    
    for (const ep of aggregated.top_endpoints.slice(0, 8)){
      const epTotal = (ep.same||0) + (ep.diff||0) + (ep.miss||0);
      const epHitRate = epTotal > 0 ? ((ep.same||0) / epTotal * 100).toFixed(0) : 0;
      
      html += `
        <div class="endpoint-row">
          <div class="path" title="${ep.path}">${ep.path}</div>
          <div class="hits">${epHitRate}% hit</div>
          <div class="saved">${formatBytes(ep.bytes_saved||0)}</div>
        </div>
      `;
    }
    
    html += `</div>`;
  }
  
  // Details button
  html += `
    <div class="mini" style="margin-top:10px;">
      <div class="tag" onclick="showModal('Cache Performance Details', ${JSON.stringify(JSON.stringify(aggregated))})">
        <strong>View Raw Data</strong>
      </div>
    </div>
  `;
  
  el.innerHTML = html;
}

/**********************************************************************
 * Build model
 **********************************************************************/
function hostName(ip){ return HOSTS.has(ip) ? HOSTS.get(ip).hostname : ip; }

async function buildFromSources(){
  const statusEl = document.getElementById("status");
  const hudEl = document.getElementById("hud");
  const t0 = performance.now();

  const prev = { HOSTS, SENSORS, SENSOR_BY_HOSTIP, SENSOR_DATA_CACHE, NODES, EDGES, PHYS_LINKS, LINK_QUALITY, SUBNET_EDGES, DBHOST_IP, CACHE_BY_HOST };

  let _HOSTS = new Map();
  let _SENSORS = [];
  let _SENSOR_BY_HOSTIP = new Map();
  let _SENSOR_DATA_CACHE = new Map();
  let _NODES = new Map();
  let _EDGES = new Map();
  let _PHYS_LINKS = new Map();
  let _LINK_QUALITY = new Map();
  let _SUBNET_EDGES = new Map();
  let _DBHOST_IP = "";
  let _CACHE_BY_HOST = new Map();

  try {
    const hostsArr = await jget("/getHosts.php");
    if (!Array.isArray(hostsArr)) throw new Error("getHosts.php returned non-array");
    for (const h of hostsArr){
      const ip = String(h.ip||"").trim();
      const hostname = String(h.hostname||h.name||ip).trim();
      const echo = parseEcho(String(h.echo||""));
      _HOSTS.set(ip, { ip, hostname, echo });
    }

    const saveNodes = NODES;
    const saveCache = SENSOR_DATA_CACHE;
    NODES = _NODES;
    SENSOR_DATA_CACHE = _SENSOR_DATA_CACHE;

    for (const [ip, h] of _HOSTS.entries()){
      ensureNode(ip, h.hostname, ip);
      if (!_DBHOST_IP && (h.hostname.toLowerCase().includes("databasehost") || h.hostname.toLowerCase() === "databasehost.frognet")){
        _DBHOST_IP = ip;
      }
      if (!_DBHOST_IP && h.echo && (String(h.echo.fqdn||"").toLowerCase() === "databasehost.frognet")){
        _DBHOST_IP = ip;
      }
    }

    const internetId = "external:internet";
    ensureNode(internetId, "Internet", "");

    _SENSORS = await fetchSensors();
    for (const s of _SENSORS){
      const hostIp = String(s.SensorAddress || "").trim();
      if (!hostIp) continue;
      if (!_SENSOR_BY_HOSTIP.has(hostIp)) _SENSOR_BY_HOSTIP.set(hostIp, []);
      _SENSOR_BY_HOSTIP.get(hostIp).push(s);
    }

    // Internet edges
    for (const [ip, h] of _HOSTS.entries()){
      const { gw0, gw1 } = h.echo || {};
      const gws = [gw0, gw1].filter(x => x && x !== "0.0.0.0");
      for (const gw of gws){
        if (!isFrogNetIp(gw)){
          const k = `${ip}→${internetId}`;
          if (!_EDGES.has(k)) _EDGES.set(k, { from: ip, to: internetId, kind:"EXTERNAL", meta:{ gw, dev:"internet" } });
          const e = _EDGES.get(k);
          e.kind = "EXTERNAL";
          e.meta = { gw, dev:"internet" };
        }
      }
    }

    function upsertDirectedEdge(from, to, kind, meta = {}) {
      if (!_HOSTS.has(from) || !_HOSTS.has(to)) return;
      if (from === to) return;
      const key = `${from}→${to}`;
      const prevE = _EDGES.get(key);
      if (!prevE) {
        _EDGES.set(key, { from, to, kind, meta: { ...meta } });
        return;
      }
      const next = { ...prevE, meta: { ...(prevE.meta || {}) } };
      if (String(next.kind || "FAST") !== "SEMANTIC" && String(kind || "FAST") === "SEMANTIC") {
        next.kind = "SEMANTIC";
      }
      for (const f of ["dev", "via", "reason"]) {
        const cur = (next.meta[f] === undefined || next.meta[f] === null) ? "" : String(next.meta[f]);
        const inc = (meta[f] === undefined || meta[f] === null) ? "" : String(meta[f]);
        if ((!cur || cur.trim() === "") && inc && inc.trim() !== "") next.meta[f] = inc;
      }
      _EDGES.set(key, next);
    }

    function upsertPhysLink(a, b, kind, meta = {}) {
      if (!_HOSTS.has(a) || !_HOSTS.has(b) || a === b) return;
      const key = canonicalKey(a, b);
      const prevL = _PHYS_LINKS.get(key);
      if (!prevL) {
        _PHYS_LINKS.set(key, { a, b, kind, ...meta });
        return;
      }
      const next = { ...prevL };
      if (String(next.kind||"FAST") !== "SEMANTIC" && String(kind||"FAST") === "SEMANTIC") {
        next.kind = "SEMANTIC";
      }
      for (const f of ["dev","via","reason"]) {
        const cur = (next[f] === undefined || next[f] === null) ? "" : String(next[f]);
        const inc = (meta[f] === undefined || meta[f] === null) ? "" : String(meta[f]);
        if ((!cur || cur.trim()==="") && inc && inc.trim()!=="") next[f] = inc;
      }
      _PHYS_LINKS.set(key, next);
    }

    // LinkState sensors
    const linkStateSensors = _SENSORS.filter(s => {
      const t = String(s.SensorType||"");
      return (t === "LinkState" || t === "LinkState.Edge");
    });

    for (const s of linkStateSensors) {
      const hostIp = String(s.SensorAddress||"").trim();
      const obj = await fetchSensorData(s.SensorID);
      const edges = normalizeEdgesFromLinkStateJson(obj);
      if (!edges.length) continue;

      for (const e of edges) {
        const peer = String(e.peer_host_ip||"").trim();
        const kind = String(e.kind||"FAST");
        const meta = { reason: e.reason, dev: e.dev, via: e.via };

        upsertPhysLink(hostIp, peer, kind, meta);
        upsertDirectedEdge(hostIp, peer, (String(kind).toUpperCase()==="SEMANTIC") ? "SEMANTIC" : "FAST", meta);
      }
    }

    // Cache performance sensors
    const cacheSensors = _SENSORS.filter(s => {
      const t = String(s.SensorType||"");
      return (t === "SemanticCache" || t === "SemanticDaemon.Cache");
    });

    for (const s of cacheSensors) {
      const hostIp = String(s.SensorAddress||"").trim();
      const obj = await fetchSensorData(s.SensorID);
      if (obj && obj.totals){
        _CACHE_BY_HOST.set(hostIp, obj);
      }
    }

    // subnet edges
    _SUBNET_EDGES = new Map();
    for (const L of _PHYS_LINKS.values()){
      const ta = subnetThird(L.a);
      const tb = subnetThird(L.b);
      if (ta === null || tb === null || ta === tb) continue;
      const sk = [ta,tb].sort((x,y)=>x-y).join("|");
      const knd = (String(L.kind||"FAST") === "SEMANTIC") ? "SEMANTIC" : "FAST";
      const prevSE = _SUBNET_EDGES.get(sk);
      if (!prevSE){
        _SUBNET_EDGES.set(sk, {
          a_sub: Math.min(ta,tb),
          b_sub: Math.max(ta,tb),
          hostsKey: canonicalKey(L.a,L.b),
          kind: knd
        });
      } else {
        if (prevSE.kind !== "SEMANTIC" && knd === "SEMANTIC") prevSE.kind = "SEMANTIC";
      }
    }

    const hasInternet = Array.from(_EDGES.values()).some(e => e.kind === "EXTERNAL");
    if (!hasInternet){
      _NODES.delete(internetId);
    } else {
      const rect2 = canvas.getBoundingClientRect();
      const posStore2 = loadPositions();
      if (!posStore2[internetId]){
        posStore2[internetId] = { x: rect2.width * 0.92, y: rect2.height * 0.50 };
        savePositions(posStore2);
      }
    }

    NODES = saveNodes;
    SENSOR_DATA_CACHE = saveCache;

    const hadHosts = prev.HOSTS && prev.HOSTS.size > 0;
    const hadEdges = (prev.EDGES && prev.EDGES.size > 0) || (prev.SUBNET_EDGES && prev.SUBNET_EDGES.size > 0);

    if (hadHosts && _HOSTS.size === 0) throw new Error("Transient empty hosts snapshot (kept last-good)");
    if (hadEdges && _EDGES.size === 0) throw new Error("Transient empty edges snapshot (kept last-good)");

    HOSTS = _HOSTS;
    SENSORS = _SENSORS;
    SENSOR_BY_HOSTIP = _SENSOR_BY_HOSTIP;
    SENSOR_DATA_CACHE = _SENSOR_DATA_CACHE;
    NODES = _NODES;
    EDGES = _EDGES;
    PHYS_LINKS = _PHYS_LINKS;
    LINK_QUALITY = _LINK_QUALITY;
    SUBNET_EDGES = _SUBNET_EDGES;
    DBHOST_IP = _DBHOST_IP;
    CACHE_BY_HOST = _CACHE_BY_HOST;

    NODE_COLOR_MAP = computeUniqueNodeColors(Array.from(NODES.keys()).map(idNorm));
    for (const id of NODES.keys()) assignColorIfMissing(id);
    for (const ip of HOSTS.keys()) assignColorIfMissing(ip);

    renderCacheTiles();
    renderLinkTiles();
    renderHostTiles();

    resolveOverlaps(80);
    fitToScreen(NODES);
    draw();

    const dt = Math.round(performance.now() - t0);
    statusEl.textContent = `${HOSTS.size} hosts · ${PHYS_LINKS.size} links · ${cacheSensors.length} cache sensors · ${dt}ms`;
    const dbtxt = DBHOST_IP ? `databasehost=${hostName(DBHOST_IP)}` : `databasehost: (not detected)`;
    hudEl.textContent = `SAME/DIFF caching active. ${dbtxt}`;

  } catch (e){
    HOSTS = prev.HOSTS; SENSORS = prev.SENSORS; SENSOR_BY_HOSTIP = prev.SENSOR_BY_HOSTIP;
    SENSOR_DATA_CACHE = prev.SENSOR_DATA_CACHE; NODES = prev.NODES; EDGES = prev.EDGES;
    PHYS_LINKS = prev.PHYS_LINKS; LINK_QUALITY = prev.LINK_QUALITY; SUBNET_EDGES = prev.SUBNET_EDGES;
    DBHOST_IP = prev.DBHOST_IP; CACHE_BY_HOST = prev.CACHE_BY_HOST;
    throw e;
  }
}

/**********************************************************************
 * Sidebar render - Hosts
 **********************************************************************/
function renderHostTiles(){
  const el = document.getElementById("hostTiles");
  el.innerHTML = "";

  const hosts = Array.from(HOSTS.values()).sort((a,b) => (a.ip||"").localeCompare(b.ip||""));
  const KEY_TYPES = new Set(["LinkState","LinkState.Edge","LinkQuality","LinkQuality.Score","SemanticCache","SemanticDaemon.Cache","SemanticProxy","SemanticDaemon","System","GPS"]);

  for (const h of hosts){
    const hostIp = h.ip;
    const t = document.createElement("div");
    t.className = "tile";

    const row = document.createElement("div");
    row.className = "row";

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = nodeColorForId(hostIp);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = h.hostname + ((DBHOST_IP && hostIp === DBHOST_IP) ? " (databasehost)" : "");

    const ip = document.createElement("div");
    ip.className = "ip";
    ip.textContent = h.ip;

    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(ip);

    const mini = document.createElement("div");
    mini.className = "mini";

    const sensors = (SENSOR_BY_HOSTIP.get(hostIp) || []).slice();
    sensors.sort((a,b) => String(a.SensorType||"").localeCompare(String(b.SensorType||"")));

    const keySensors = sensors.filter(s => KEY_TYPES.has(String(s.SensorType||"")));
    const showSensors = keySensors.slice(0, 10);

    for (const s of showSensors){
      const btn = document.createElement("div");
      btn.className = "tag";
      btn.innerHTML = `<strong>${String(s.SensorType||"")}</strong>`;
      btn.title = String(s.SensorName||"");
      btn.onclick = async () => {
        const obj = await fetchSensorData(s.SensorID);
        showModal(`${h.hostname} — ${s.SensorName} (SensorID=${s.SensorID})`, obj || "No data");
      };
      mini.appendChild(btn);
    }

    const allBtn = document.createElement("div");
    allBtn.className = "tag";
    allBtn.innerHTML = `<strong>All Sensors</strong>`;
    allBtn.onclick = () => {
      const list = sensors.map(s => `${s.SensorType}: ${s.SensorName} (SensorID=${s.SensorID})`).join("\n");
      showModal(`${h.hostname} — Sensors`, list || "No sensors");
    };
    mini.appendChild(allBtn);

    t.appendChild(row);
    t.appendChild(mini);
    el.appendChild(t);
  }
}

/**********************************************************************
 * Sidebar render - Links
 **********************************************************************/
function renderLinkTiles(){
  const el = document.getElementById("linkTiles");
  el.innerHTML = "";

  const edges = Array.from(SUBNET_EDGES.values()).sort((x,y) => {
    if (x.a_sub !== y.a_sub) return x.a_sub - y.a_sub;
    return x.b_sub - y.b_sub;
  });

  if (!edges.length){
    const t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = `<div class="linkmeta">No subnet links found.</div>`;
    el.appendChild(t);
    return;
  }

  for (const E of edges){
    const aSub = E.a_sub;
    const bSub = E.b_sub;
    const hostsKey = E.hostsKey;
    const L = PHYS_LINKS.get(hostsKey);

    const kind = (L && String(L.kind||"FAST") === "SEMANTIC") ? "SEMANTIC" : "FAST";

    const t = document.createElement("div");
    t.className = "tile";

    const row = document.createElement("div");
    row.className = "row";

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = (L ? nodeColorForId(L.a) : getCss("--unknown"));

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = `${aSub} ↔ ${bSub}`;

    const ip = document.createElement("div");
    ip.className = "ip";
    ip.textContent = (kind === "SEMANTIC") ? "SEMANTIC" : "FAST";

    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(ip);

    const meta = document.createElement("div");
    meta.className = "linkmeta";

    if (!L){
      meta.innerHTML = `<b>${aSub}↔${bSub}</b> has no host-edge record.`;
    } else {
      const ltxt = `link.dev=${String(L.dev||"")}${L.via?`, via=${String(L.via)}`:""}`;
      meta.innerHTML = `<b>${hostName(L.a)}</b> ↔ <b>${hostName(L.b)}</b><br>${ltxt}<br>reason=${String(L.reason||"")}`;
    }

    const mini = document.createElement("div");
    mini.className = "mini";

    const detailsBtn = document.createElement("div");
    detailsBtn.className = "tag";
    detailsBtn.innerHTML = `<strong>Details</strong>`;
    detailsBtn.onclick = () => showModal(`Link — ${aSub}↔${bSub}`, { link: L || null });

    mini.appendChild(detailsBtn);

    t.appendChild(row);
    t.appendChild(meta);
    t.appendChild(mini);
    el.appendChild(t);
  }
}

/**********************************************************************
 * Polling
 **********************************************************************/
let REFRESH_INFLIGHT = false;
async function tick(){
  if (REFRESH_INFLIGHT) return;
  REFRESH_INFLIGHT = true;
  try{
    await buildFromSources();
  } catch(err){
    console.error(err);
    document.getElementById("status").textContent = `Update failed: ${err.message || String(err)}`;
  } finally {
    REFRESH_INFLIGHT = false;
  }
}

let timer = null;
function startPolling(){
  if (timer) clearInterval(timer);
  const sec = Math.max(1, Number(document.getElementById("pollSec").value || 2));
  timer = setInterval(tick, sec*1000);
}

document.getElementById("btnFit").onclick = () => { fitToScreen(NODES); draw(); };
document.getElementById("btnRefresh").onclick = () => tick();
document.getElementById("pollSec").onchange = () => startPolling();

startPolling();
tick();
</script>
</body>
</html>
