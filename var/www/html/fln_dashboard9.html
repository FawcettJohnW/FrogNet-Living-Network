<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FrogNet Living Network</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#101826;
      --panel2:#0f1724;
      --line:#223047;
      --txt:#e6edf3;
      --muted:#9aa8b6;

      /* Per your directives */
      --internet:#7aa2ff;   /* BLUE: host -> upstream/external */
      --semantic:#f7c948;   /* YELLOW: mode BFR-LD1 */
      --fast:#2bd576;       /* GREEN: FAST host<->host */
      --unknown:#6b7c93;

      --good:#2bd576;
      --ok:#f7c948;
      --bad:#ff5d5d;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;

      --dbglow: rgba(43,213,118,0.65);
      --dbglow2: rgba(43,213,118,0.35);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--txt);
      font-family:var(--sans);
      overflow:hidden;
    }

    header{
      height:64px;
      padding:10px 14px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:14px;
    }
    header .title{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    header h1{
      margin:0;
      font-size:28px;
      font-weight:700;
      letter-spacing:0.2px;
      line-height:1.05;
    }
    header .sub{
      color:var(--muted);
      font-size:12px;
      line-height:1.2;
    }

    header .controls{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .ctl{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:var(--muted);
    }
    .ctl select{
      background:var(--panel2);
      border:1px solid var(--line);
      color:var(--txt);
      border-radius:10px;
      padding:6px 8px;
      font-size:12px;
      outline:none;
      font-family:var(--mono);
    }
    .btn{
      background:var(--panel2);
      border:1px solid var(--line);
      color:var(--txt);
      border-radius:10px;
      padding:7px 10px;
      cursor:pointer;
      font-size:12px;
      user-select:none;
    }
    .btn:hover{ filter:brightness(1.07); }
    .btn:active{ transform: translateY(1px); }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--panel2);
      font-size:12px;
      color:var(--muted);
      max-width:620px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .layout{
      height: calc(100% - 64px);
      display:flex;
      min-height:0;
    }

    aside{
      width:440px;
      background:var(--panel);
      border-right:1px solid var(--line);
      padding:12px;
      overflow:auto;
    }

    .section{
      margin-bottom:12px;
      padding:10px;
      background:var(--panel2);
      border:1px solid var(--line);
      border-radius:14px;
    }
    .section h2{
      margin:0 0 8px 0;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:0.3px;
      text-transform:uppercase;
    }

    .tile{
      border:1px solid var(--line);
      background:#0c131f;
      border-radius:14px;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:10px;
    }
    .tile .row{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background:var(--unknown);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
      flex:0 0 auto;
    }
    .tile .name{
      font-weight:700;
      font-size:13px;
      color:var(--txt);
      flex:1 1 auto;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .tile .ip{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      flex:0 0 auto;
    }

    .mini{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tag{
      font-family:var(--mono);
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#0b0f14;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .tag:hover{ filter:brightness(1.08); }
    .tag strong{ color:var(--txt); font-weight:700; }

    .linkmeta{
      font-family:var(--mono);
      font-size:11px;
      color:var(--muted);
      line-height:1.35;
    }
    .linkmeta b{ color:var(--txt); font-weight:700; }

    main{
      flex:1 1 auto;
      position:relative;
      min-width:0;
      min-height:0;
    }
    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .hud{
      position:absolute;
      left:12px;
      bottom:12px;
      display:flex;
      gap:10px;
      align-items:center;
      pointer-events:none;
    }
    .hud .pill{ pointer-events:none; }

    /* Modal */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .modal{
      width:min(980px, 96vw);
      max-height: 90vh;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .modal header{
      height:auto;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .modal header .m-title{
      font-size:13px;
      font-weight:700;
      color:var(--txt);
      flex:1;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .modal header .m-close{
      flex:0 0 auto;
    }
    pre{
      margin:0;
      padding:12px;
      background:#0b0f14;
      color:var(--txt);
      overflow:auto;
      font-family:var(--mono);
      font-size:12px;
      line-height:1.35;
      white-space:pre-wrap;
      word-break:break-word;
      flex:1 1 auto;
    }
  </style>
</head>

<body>
<header>
  <div class="title">
    <h1>FrogNet Living Network</h1>
    <div class="sub">
      FAST links GREEN. mode BFR-LD1 links YELLOW (arrow). Internet links BLUE (arrow; only on attached node).
    </div>
  </div>

  <div class="controls">
    <div class="ctl">
      <span>Poll</span>
      <select id="pollSec">
        <option value="1">1s</option>
        <option value="2" selected>2s</option>
        <option value="5">5s</option>
        <option value="10">10s</option>
      </select>
    </div>
    <button class="btn" id="btnFit">Fit</button>
    <button class="btn" id="btnRefresh">Refresh</button>
    <div class="pill" id="status">—</div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="section">
      <h2>Network Links</h2>
      <div id="linkTiles"></div>
    </div>

    <div class="section">
      <h2>Hosts</h2>
      <div id="hostTiles"></div>
    </div>
  </aside>

  <main>
    <canvas id="net"></canvas>
    <div class="hud">
      <div class="pill" id="hud">—</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <header>
      <div class="m-title" id="modalTitle">—</div>
      <button class="btn m-close" id="modalClose">Close</button>
    </header>
    <pre id="modalBody"></pre>
  </div>
</div>

<script>
/**********************************************************************
 * Helpers
 **********************************************************************/
function isV4(s){ return typeof s === "string" && /^\d+\.\d+\.\d+\.\d+$/.test(s); }
function isFrogNetIp(ip){ return typeof ip === "string" && ip.startsWith("10."); }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

async function jget(url){
  const r = await fetch(url, { cache:"no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
  return await r.json();
}

function parseEcho(echoStr){
  if (typeof echoStr !== "string") return { fqdn:"", hostPath:"", gw0:"", gw1:"" };
  const parts = echoStr.trim().split(",");
  return {
    fqdn: (parts[0]||"").trim(),
    hostPath: (parts[1]||"").trim(),
    gw0: (parts[2]||"").trim(),
    gw1: (parts[3]||"").trim(),
  };
}

function canonicalKey(a,b){ return [a,b].sort().join("|"); }

function subnetThird(ip){
  if (!isV4(ip)) return null;
  const p = ip.split(".");
  return p[2] ? Number(p[2]) : null;
}

/* api.php may return jsonData as an OBJECT already (not a string). */
function safeJsonParse(v){
  if (v === null || v === undefined) return null;
  if (typeof v === "object") return v;
  if (typeof v !== "string") return null;
  try { return JSON.parse(v); } catch { return null; }
}

/**********************************************************************
 * Modal
 **********************************************************************/
const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody  = document.getElementById("modalBody");
document.getElementById("modalClose").onclick = () => { modalBackdrop.style.display="none"; };
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) modalBackdrop.style.display="none"; });

function showModal(title, obj){
  modalTitle.textContent = title;
  modalBody.textContent = (typeof obj === "string") ? obj : JSON.stringify(obj, null, 2);
  modalBackdrop.style.display = "flex";
}

/**********************************************************************
 * Canvas HiDPI sizing
 **********************************************************************/
const canvas = document.getElementById("net");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width  = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/**********************************************************************
 * View transform
 **********************************************************************/
let view = { x: 0, y: 0, k: 1.0 };
function worldToScreen(p){ return { x: p.x*view.k + view.x, y: p.y*view.k + view.y }; }
function screenToWorld(p){ return { x: (p.x - view.x)/view.k, y: (p.y - view.y)/view.k }; }

function fitToScreen(nodes){
  const rect = canvas.getBoundingClientRect();
  const sw = rect.width, sh = rect.height;

  const arr = Array.from(nodes.values());
  if (!arr.length) return;

  let minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
  for (const n of arr){
    minx = Math.min(minx, n.x);
    miny = Math.min(miny, n.y);
    maxx = Math.max(maxx, n.x);
    maxy = Math.max(maxy, n.y);
  }

  const pad = 160;
  minx -= pad; miny -= pad; maxx += pad; maxy += pad;

  const w = Math.max(1, maxx - minx);
  const h = Math.max(1, maxy - miny);

  const k = Math.min(sw / w, sh / h, 1.6);
  view.k = Math.max(0.25, k);

  const cx = (minx + maxx)/2;
  const cy = (miny + maxy)/2;
  view.x = sw/2 - cx*view.k;
  view.y = sh/2 - cy*view.k;
}

/**********************************************************************
 * Persistent positions
 **********************************************************************/
const POS_KEY = "frognet_livingnet_positions_v8";
function loadPositions(){
  try { return JSON.parse(localStorage.getItem(POS_KEY)||"{}") || {}; } catch(e){ return {}; }
}
function savePositions(pos){
  try { localStorage.setItem(POS_KEY, JSON.stringify(pos)); } catch(e){}
}
function hashStr(s){
  let h=2166136261;
  for (let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h>>>0);
}
function seeded01(s){ return (hashStr(s) % 1000000) / 1000000; }

/**********************************************************************
 * State
 **********************************************************************/
const EDGE_W = 3.0;

let HOSTS = new Map();            // ip -> {ip, hostname, echo}
let SENSORS = [];                 // sensors rows
let SENSOR_BY_HOSTIP = new Map(); // host_ip -> [sensors]
let SENSOR_DATA_CACHE = new Map();// SensorID -> parsed jsonData (object)

let NODES = new Map();            // id -> node {x,y,w,h,label,ip}
let EDGES = new Map();            // directed edges for canvas
let PHYS_LINKS = new Map();       // canonical host-host edges: key -> {a,b, kind, reason, dev, via}
let LINK_QUALITY = new Map();     // key -> best quality record
let SUBNET_EDGES = new Map();     // subnetKey "20|30" -> {a_sub,b_sub, hostsKey, kind}

let DBHOST_IP = "";

/**********************************************************************
 * Node box sizing
 **********************************************************************/
function computeNodeBox(label, ip){
  const padX = 14;
  const padY = 10;
  ctx.save();
  ctx.font = `13px ${getCss("--sans")}`;
  const w1 = ctx.measureText(label || "").width;
  ctx.font = `12px ${getCss("--mono")}`;
  const w2 = ctx.measureText(ip || "").width;
  ctx.restore();
  const w = Math.max(120, Math.ceil(Math.max(w1, w2) + padX*2));
  const h = 52 + padY;
  return { w, h };
}

function ensureNode(id, label, ipForSort){
  if (!NODES.has(id)){
    const posStore = loadPositions();
    const rect = canvas.getBoundingClientRect();
    const wv = rect.width, hv = rect.height;

    let x, y;
    if (posStore[id] && typeof posStore[id].x === "number" && typeof posStore[id].y === "number"){
      x = posStore[id].x; y = posStore[id].y;
    } else {
      let col = 0.50;
      if (ipForSort && ipForSort.startsWith("10.101.")){
        const p = ipForSort.split(".");
        const third = Number(p[2]||0);
        col = (third === 10) ? 0.22 : (third === 20 ? 0.36 : (third === 30 ? 0.50 : (third === 50 ? 0.68 : 0.82)));
      }
      if (id.startsWith("external:")) col = 0.92;

      x = wv * col + (seeded01(id)-0.5)*90;
      y = hv * (0.22 + 0.60*seeded01("y:"+id));

      posStore[id] = { x, y };
      savePositions(posStore);
    }

    const box = computeNodeBox(label||id, ipForSort||"");
    NODES.set(id, { id, label: label||id, ip: ipForSort||"", x, y, w: box.w, h: box.h });
  } else {
    const n = NODES.get(id);
    if (label && n.label !== label) n.label = label;
    if (ipForSort && !n.ip) n.ip = ipForSort;
    const box = computeNodeBox(n.label, n.ip);
    n.w = box.w; n.h = box.h;
  }
  return NODES.get(id);
}

function ensureEdge(from, to){
  const k = `${from}→${to}`;
  if (!EDGES.has(k)) EDGES.set(k, { from, to, kind:"UNKNOWN", meta:{} });
  return EDGES.get(k);
}

/**********************************************************************
 * Edge/node geometry
 **********************************************************************/
function intersectRectBoundary(fromNode, toNode){
  const fx = fromNode.x, fy = fromNode.y;
  const tx = toNode.x,   ty = toNode.y;
  const dx = tx - fx;
  const dy = ty - fy;
  const hw = fromNode.w/2;
  const hh = fromNode.h/2;

  if (dx === 0 && dy === 0) return { x: fx, y: fy };

  const sx = (dx !== 0) ? (hw / Math.abs(dx)) : Infinity;
  const sy = (dy !== 0) ? (hh / Math.abs(dy)) : Infinity;
  const t = Math.min(sx, sy);

  return { x: fx + dx * t, y: fy + dy * t };
}

/**********************************************************************
 * Layout fix: prevent node overlap (simple deterministic relaxation)
 **********************************************************************/
function rectOf(n, pad=18){
  return {
    x0: n.x - n.w/2 - pad,
    y0: n.y - n.h/2 - pad,
    x1: n.x + n.w/2 + pad,
    y1: n.y + n.h/2 + pad
  };
}
function rectsOverlap(a,b){
  return !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1);
}
function resolveOverlaps(iter=70){
  const nodes = Array.from(NODES.values());
  if (nodes.length < 2) return;

  for (let k=0;k<iter;k++){
    let moved = false;

    for (let i=0;i<nodes.length;i++){
      for (let j=i+1;j<nodes.length;j++){
        const A = nodes[i], B = nodes[j];
        const ra = rectOf(A, 18);
        const rb = rectOf(B, 18);
        if (!rectsOverlap(ra, rb)) continue;

        const dx = (A.x - B.x) || ((seeded01("dx:"+A.id+"|"+B.id)-0.5) * 0.01);
        const dy = (A.y - B.y) || ((seeded01("dy:"+A.id+"|"+B.id)-0.5) * 0.01);

        const overlapX = Math.min(ra.x1, rb.x1) - Math.max(ra.x0, rb.x0);
        const overlapY = Math.min(ra.y1, rb.y1) - Math.max(ra.y0, rb.y0);

        if (overlapX < overlapY){
          const push = (overlapX/2 + 3) * Math.sign(dx);
          A.x += push;
          B.x -= push;
        } else {
          const push = (overlapY/2 + 3) * Math.sign(dy);
          A.y += push;
          B.y -= push;
        }
        moved = true;
      }
    }

    if (!moved) break;
  }
}

/**********************************************************************
 * Edge routing: curve edges so they do not run behind nodes
 **********************************************************************/
function segmentIntersectsRect(p0, p1, r){
  const minx = Math.min(p0.x,p1.x), maxx = Math.max(p0.x,p1.x);
  const miny = Math.min(p0.y,p1.y), maxy = Math.max(p0.y,p1.y);
  if (maxx < r.x0 || minx > r.x1 || maxy < r.y0 || miny > r.y1) return false;

  const steps = 18;
  for (let i=0;i<=steps;i++){
    const t = i/steps;
    const x = p0.x + (p1.x - p0.x)*t;
    const y = p0.y + (p1.y - p0.y)*t;
    if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) return true;
  }
  return false;
}

function edgeCurvePoints(a, b){
  const pA = intersectRectBoundary(a, b);
  const pB = intersectRectBoundary(b, a);

  const mx = (pA.x + pB.x)/2;
  const my = (pA.y + pB.y)/2;
  const dx = pB.x - pA.x;
  const dy = pB.y - pA.y;
  const len = Math.max(1, Math.hypot(dx,dy));
  const nx = -dy/len;
  const ny =  dx/len;

  const side = (hashStr(a.id + "->" + b.id) & 1) ? 1 : -1;

  let bend = 26;
  for (let tries=0; tries<10; tries++){
    const c = { x: mx + nx * bend * side, y: my + ny * bend * side };

    let blocked = false;
    for (const n of NODES.values()){
      if (n.id === a.id || n.id === b.id) continue;
      const r = rectOf(n, 10);
      if (segmentIntersectsRect(pA, c, r) || segmentIntersectsRect(c, pB, r) || segmentIntersectsRect(pA, pB, r)){
        blocked = true;
        break;
      }
    }

    if (!blocked) return { pA, pB, c };
    bend += 22;
  }

  return { pA, pB, c: { x: mx + nx * 160 * side, y: my + ny * 160 * side } };
}

/**********************************************************************
 * Canvas draw
 **********************************************************************/
function edgeColor(kind){
  if (kind === "EXTERNAL") return getCss("--internet");
  if (kind === "SEMANTIC") return getCss("--semantic");
  if (kind === "FAST") return getCss("--fast");
  return getCss("--unknown");
}

function drawRoundedRect(x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
}

function draw(){
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);

  // Draw edges first
  const arrowHeads = [];
  for (const e of EDGES.values()){
    const a = NODES.get(e.from);
    const b = NODES.get(e.to);
    if (!a || !b) continue;

    const { pA, pB, c } = edgeCurvePoints(a, b);

    const A = worldToScreen(pA);
    const B = worldToScreen(pB);
    const C = worldToScreen(c);

    const col = edgeColor(e.kind);

    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = EDGE_W;
    ctx.globalAlpha = (e.kind === "UNKNOWN") ? 0.45 : 0.9;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.quadraticCurveTo(C.x, C.y, B.x, B.y);
    ctx.stroke();
    ctx.restore();

    if (e.kind === "SEMANTIC" || e.kind === "EXTERNAL"){
      const tx = B.x - C.x;
      const ty = B.y - C.y;
      const ang = Math.atan2(ty, tx);
      arrowHeads.push({ bx: B.x, by: B.y, ang, col });
    }
  }

  // Draw nodes (on top)
  for (const n of NODES.values()){
    const P = worldToScreen(n);

    const w = n.w * view.k;
    const h = n.h * view.k;
    const x = P.x - w/2;
    const y = P.y - h/2;

    const isExternal = n.id.startsWith("external:");
    const isDb = (!isExternal && DBHOST_IP && n.id === DBHOST_IP);

    const ring = isExternal ? getCss("--internet") : getCss("--fast");
    const fill = "rgba(230,237,243,0.96)";

    ctx.save();

    if (isDb){
      ctx.shadowColor = getCss("--dbglow");
      ctx.shadowBlur = 26;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    }

    drawRoundedRect(x, y, w, h, 14*view.k);
    ctx.fillStyle = fill;
    ctx.globalAlpha = 1.0;
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = ring;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.9;
    ctx.stroke();

    if (isDb){
      ctx.strokeStyle = getCss("--dbglow2");
      ctx.lineWidth = 10;
      ctx.globalAlpha = 0.75;
      ctx.stroke();
    }

    const label = n.label || n.id;
    const ip = isExternal ? "Internet" : (n.ip || "");

    ctx.globalAlpha = 1.0;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#0b0f14";
    ctx.font = `13px ${getCss("--sans")}`;
    ctx.fillText(label, P.x, P.y - 8);

    ctx.fillStyle = "rgba(11,15,20,0.85)";
    ctx.font = `12px ${getCss("--mono")}`;
    ctx.fillText(ip, P.x, P.y + 14);

    ctx.restore();
  }

  // Arrowheads on top
  for (const h of arrowHeads){
    const { bx, by, ang, col } = h;
    const pullback = 16;
    const hx = bx - Math.cos(ang) * pullback;
    const hy = by - Math.sin(ang) * pullback;
    const head = 11;

    ctx.save();
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.95;

    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx - head*Math.cos(ang - Math.PI/6), hy - head*Math.sin(ang - Math.PI/6));
    ctx.lineTo(hx - head*Math.cos(ang + Math.PI/6), hy - head*Math.sin(ang + Math.PI/6));
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

/**********************************************************************
 * Interaction (rectangle hit test)
 **********************************************************************/
let dragging = { mode:"none", id:"", start:{x:0,y:0}, view0:{x:0,y:0,k:1} };

function hitTestNode(worldPt){
  for (const n of NODES.values()){
    const x0 = n.x - (n.w/2);
    const y0 = n.y - (n.h/2);
    const x1 = n.x + (n.w/2);
    const y1 = n.y + (n.h/2);
    if (worldPt.x >= x0 && worldPt.x <= x1 && worldPt.y >= y0 && worldPt.y <= y1) return n;
  }
  return null;
}

canvas.addEventListener("mousedown", (ev) => {
  const rect = canvas.getBoundingClientRect();
  const p = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  const w = screenToWorld(p);

  const hit = hitTestNode(w);

  if (hit){
    dragging.mode = "node";
    dragging.id = hit.id;
  } else {
    dragging.mode = "pan";
    dragging.view0 = { x: view.x, y: view.y, k: view.k };
    dragging.start = p;
  }
});

window.addEventListener("mouseup", () => {
  if (dragging.mode === "node"){
    const n = NODES.get(dragging.id);
    if (n){
      const posStore = loadPositions();
      posStore[n.id] = { x: n.x, y: n.y };
      savePositions(posStore);
    }
  }
  dragging.mode = "none";
  dragging.id = "";
});

window.addEventListener("mousemove", (ev) => {
  if (dragging.mode === "none") return;

  const rect = canvas.getBoundingClientRect();
  const p = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };

  if (dragging.mode === "pan"){
    const dx = p.x - dragging.start.x;
    const dy = p.y - dragging.start.y;
    view.x = dragging.view0.x + dx;
    view.y = dragging.view0.y + dy;
    draw();
    return;
  }

  if (dragging.mode === "node"){
    const n = NODES.get(dragging.id);
    if (!n) return;
    const w = screenToWorld(p);
    n.x = w.x;
    n.y = w.y;
    draw();
  }
});

canvas.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const p = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  const before = screenToWorld(p);

  const delta = Math.sign(ev.deltaY);
  const factor = (delta > 0) ? 0.90 : 1.11;
  view.k = Math.max(0.25, Math.min(2.5, view.k * factor));

  const after = screenToWorld(p);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;

  draw();
}, { passive:false });

/**********************************************************************
 * Data acquisition
 **********************************************************************/
async function fetchSensors(){
  const j = await jget("/frognet_api/api.php?entity=sensors&limit=4000");
  if (!j || !j.rows || !Array.isArray(j.rows)) throw new Error("sensors API returned unexpected shape");
  return j.rows;
}

async function fetchSensorData(sensorId){
  if (SENSOR_DATA_CACHE.has(sensorId)) return SENSOR_DATA_CACHE.get(sensorId);
  const j = await jget(`/frognet_api/api.php?entity=sensor_data&SensorID=${encodeURIComponent(sensorId)}&limit=1`);
  if (!j || !j.rows || !Array.isArray(j.rows)) throw new Error("sensor_data API returned unexpected shape");
  if (!j.rows.length) return null;

  const raw = j.rows[0].jsonData;
  const obj = safeJsonParse(raw);

  SENSOR_DATA_CACHE.set(sensorId, obj);
  return obj;
}

/**********************************************************************
 * Build model
 **********************************************************************/
function hostName(ip){
  return HOSTS.has(ip) ? HOSTS.get(ip).hostname : ip;
}

function buildSubnetEdgesFromPhys(){
  SUBNET_EDGES = new Map();
  for (const L of PHYS_LINKS.values()){
    const ta = subnetThird(L.a);
    const tb = subnetThird(L.b);
    if (ta === null || tb === null || ta === tb) continue;

    const sk = [ta,tb].sort((x,y)=>x-y).join("|");
    const kind = (String(L.kind||"FAST") === "SEMANTIC") ? "SEMANTIC" : "FAST";

    const prev = SUBNET_EDGES.get(sk);
    if (!prev){
      SUBNET_EDGES.set(sk, {
        a_sub: Math.min(ta,tb),
        b_sub: Math.max(ta,tb),
        hostsKey: canonicalKey(L.a,L.b),
        kind
      });
    } else {
      if (prev.kind !== "SEMANTIC" && kind === "SEMANTIC") prev.kind = "SEMANTIC";
    }
  }
}

async function buildFromSources(){
  const statusEl = document.getElementById("status");
  const hudEl = document.getElementById("hud");
  const t0 = performance.now();

  HOSTS = new Map();
  SENSORS = [];
  SENSOR_BY_HOSTIP = new Map();
  SENSOR_DATA_CACHE = new Map();
  NODES = new Map();
  EDGES = new Map();
  PHYS_LINKS = new Map();
  LINK_QUALITY = new Map();
  SUBNET_EDGES = new Map();
  DBHOST_IP = "";

  // Hosts list
  const hostsArr = await jget("/getHosts.php");
  if (!Array.isArray(hostsArr)) throw new Error("getHosts.php returned non-array");
  for (const h of hostsArr){
    const ip = String(h.ip||"").trim();
    const hostname = String(h.hostname||ip).trim();
    const echo = parseEcho(String(h.echo||""));
    HOSTS.set(ip, { ip, hostname, echo });
    ensureNode(ip, hostname, ip);

    if (!DBHOST_IP && (hostname.toLowerCase().includes("databasehost") || hostname.toLowerCase() === "databasehost.frognet")){
      DBHOST_IP = ip;
    }
    if (!DBHOST_IP && echo && (String(echo.fqdn||"").toLowerCase() === "databasehost.frognet")){
      DBHOST_IP = ip;
    }
  }

  // Internet node (only if used)
  const internetId = "external:internet";
  ensureNode(internetId, "Internet", "");

  // Sensors
  SENSORS = await fetchSensors();
  for (const s of SENSORS){
    const hostIp = String(s.SensorAddress || "").trim();
    if (!hostIp) continue;
    if (!SENSOR_BY_HOSTIP.has(hostIp)) SENSOR_BY_HOSTIP.set(hostIp, []);
    SENSOR_BY_HOSTIP.get(hostIp).push(s);
  }

  // Internet edges
  for (const [ip, h] of HOSTS.entries()){
    const { gw0, gw1 } = h.echo || {};
    const gws = [gw0, gw1].filter(x => x && x !== "0.0.0.0");
    for (const gw of gws){
      if (!isFrogNetIp(gw)){
        const e = ensureEdge(ip, internetId);
        e.kind = "EXTERNAL";
        e.meta = { gw };
      }
    }
  }

  // Build PHYS_LINKS
  PHYS_LINKS = new Map();
  function upsertPhysLink(a, b, kind, meta = {}) {
    if (!HOSTS.has(a) || !HOSTS.has(b) || a === b) return;
    const key = canonicalKey(a, b);
    const prev = PHYS_LINKS.get(key);
    if (!prev) {
      PHYS_LINKS.set(key, { a, b, kind, ...meta });
    } else if (prev.kind !== "SEMANTIC" && kind === "SEMANTIC") {
      PHYS_LINKS.set(key, { ...prev, kind, ...meta });
    }
  }

  // 1) LinkState.Edge
  for (const s of SENSORS.filter(s => s.SensorType === "LinkState")) {
    const hostIp = String(s.SensorAddress||"");
    const obj = await fetchSensorData(s.SensorID);
    if (!obj?.edges) continue;
    for (const e of obj.edges) {
      upsertPhysLink(
        hostIp,
        String(e.peer_host_ip),
        String(e.kind||"FAST"),
        { reason: e.reason, dev: e.dev, via: e.via }
      );
    }
  }

  // 2) LinkInfo.LinkPerf
  for (const s of SENSORS.filter(s => s.SensorType === "LinkInfo")) {
    const hostIp = String(s.SensorAddress||"");
    const obj = await fetchSensorData(s.SensorID);
    if (!obj?.links) continue;
    for (const l of obj.links) {
      upsertPhysLink(
        hostIp,
        String(l.peer_host_ip),
        String(l.kind||"FAST"),
        { reason: l.reason, dev: l.dev, via: l.via }
      );
    }
  }

  // 3) Routes.Table
  for (const s of SENSORS.filter(s => s.SensorType === "Routes")) {
    const hostIp = String(s.SensorAddress||"");
    const obj = await fetchSensorData(s.SensorID);
    const routes = obj?.routes?.kernel_main || [];
    for (const r of routes) {
      if (!r.dst || !r.gateway) continue;
      const peer = r.gateway;
      if (peer.startsWith("10.")) {
        upsertPhysLink(
          hostIp,
          peer,
          "FAST",
          { reason: "KERNEL_ROUTE", dev: r.dev }
        );
      }
    }
  }

  // SEMANTIC LINKS FROM LinkQuality
  const semanticQualitySensors = SENSORS.filter(s => String(s.SensorType||"") === "LinkQuality");
  for (const s of semanticQualitySensors){
    const hostIp = String(s.SensorAddress || "").trim();
    if (!HOSTS.has(hostIp)) continue;
    const obj = await fetchSensorData(s.SensorID);
    if (!obj || obj.kind !== "SEMANTIC") continue;
    const peer = String(obj.peer_host_ip || "").trim();
    if (!peer || !HOSTS.has(peer)) continue;
    const key = canonicalKey(hostIp, peer);
    PHYS_LINKS.set(key, {
      a: hostIp,
      b: peer,
      kind: "SEMANTIC",
      reason: obj.reason || "LinkQuality",
      dev: obj.dev || "",
      via: obj.via || ""
    });
  }

  // LinkQuality enrichment
  const severityRank = { "DOWN":4, "DEGRADED":3, "OK":2, "GOOD":1 };
  const linkQualitySensors = SENSORS.filter(s => String(s.SensorType||"") === "LinkQuality");
  for (const s of linkQualitySensors){
    const hostIp = String(s.SensorAddress || "").trim();
    if (!HOSTS.has(hostIp)) continue;

    const obj = await fetchSensorData(s.SensorID);
    if (!obj || typeof obj !== "object") continue;

    const peer = String(obj.peer_host_ip || "").trim();
    if (!peer || !HOSTS.has(peer)) continue;

    const key = canonicalKey(hostIp, peer);
    if (!PHYS_LINKS.has(key)) continue;

    const status = String(obj.status || "OK");
    const rank = severityRank[status] || 0;

    const prev = LINK_QUALITY.get(key);
    if (!prev){
      LINK_QUALITY.set(key, obj);
    } else {
      const prevStatus = String(prev.status || "OK");
      const prevRank = severityRank[prevStatus] || 0;
      if (rank > prevRank){
        LINK_QUALITY.set(key, obj);
      } else if (rank === prevRank){
        const s1 = Number(prev.score_0_100 || 0);
        const s2 = Number(obj.score_0_100 || 0);
        if (s2 < s1) LINK_QUALITY.set(key, obj);
      }
    }
  }

  // Canvas edges from PHYS_LINKS
  for (const L of PHYS_LINKS.values()){
    const a = L.a, b = L.b;
    const kind = (String(L.kind||"FAST") === "SEMANTIC") ? "SEMANTIC" : "FAST";
    const la = subnetThird(a);
    const lb = subnetThird(b);

    let from = a, to = b;
    if (la !== null && lb !== null){
      if (la > lb) { from = b; to = a; }
      else if (la === lb && a > b) { from = b; to = a; }
    }
    const e = ensureEdge(from, to);
    e.kind = kind;
    e.meta = { reason: L.reason, dev: L.dev, via: L.via };
  }

  // Internet node remove if unused
  const hasInternet = Array.from(EDGES.values()).some(e => e.kind === "EXTERNAL");
  if (!hasInternet){
    NODES.delete(internetId);
  } else {
    const rect = canvas.getBoundingClientRect();
    const posStore = loadPositions();
    if (!posStore[internetId]){
      posStore[internetId] = { x: rect.width * 0.92, y: rect.height * 0.50 };
      savePositions(posStore);
    }
  }

  buildSubnetEdgesFromPhys();

  renderLinkTiles();
  renderHostTiles();

  // KEY FIXES:
  //  - resolve overlaps so tiles do not stack
  //  - edges are curved by default to avoid routing behind nodes
  resolveOverlaps(80);

  fitToScreen(NODES);
  draw();

  const dt = Math.round(performance.now() - t0);
  statusEl.textContent = `${HOSTS.size} hosts · ${PHYS_LINKS.size} links · ${SUBNET_EDGES.size} subnet links · ${SENSORS.length} sensors · ${dt}ms`;
  const dbtxt = DBHOST_IP ? `databasehost=${hostName(DBHOST_IP)} (${DBHOST_IP})` : `databasehost: (not detected)`;
  hudEl.textContent = `FAST=green (no arrow), FrogNet BFR-LD1=yellow (arrow), Internet=blue (arrow). ${dbtxt}`;
}

/**********************************************************************
 * Sidebar render
 **********************************************************************/
function renderHostTiles(){
  const el = document.getElementById("hostTiles");
  el.innerHTML = "";

  const hosts = Array.from(HOSTS.values()).sort((a,b) => (a.ip||"").localeCompare(b.ip||""));
  const KEY_TYPES = new Set(["LinkState","LinkQuality","SemanticProxy","SemanticDaemon","System","GPS"]);

  for (const h of hosts){
    const hostIp = h.ip;
    const t = document.createElement("div");
    t.className = "tile";

    const row = document.createElement("div");
    row.className = "row";

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = (DBHOST_IP && hostIp === DBHOST_IP) ? getCss("--fast") : getCss("--unknown");

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = h.hostname + ((DBHOST_IP && hostIp === DBHOST_IP) ? " (databasehost)" : "");

    const ip = document.createElement("div");
    ip.className = "ip";
    ip.textContent = h.ip;

    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(ip);

    const mini = document.createElement("div");
    mini.className = "mini";

    const sensors = (SENSOR_BY_HOSTIP.get(hostIp) || []).slice();
    sensors.sort((a,b) => String(a.SensorType||"").localeCompare(String(b.SensorType||"")));

    const keySensors = sensors.filter(s => KEY_TYPES.has(String(s.SensorType||"")));
    const showSensors = keySensors.slice(0, 10);

    for (const s of showSensors){
      const btn = document.createElement("div");
      btn.className = "tag";
      btn.innerHTML = `<strong>${String(s.SensorType||"")}</strong>`;
      btn.title = String(s.SensorName||"");
      btn.onclick = async () => {
        const obj = await fetchSensorData(s.SensorID);
        showModal(`${h.hostname} — ${s.SensorName} (SensorID=${s.SensorID})`, obj || "No data");
      };
      mini.appendChild(btn);
    }

    const allBtn = document.createElement("div");
    allBtn.className = "tag";
    allBtn.innerHTML = `<strong>All Sensors</strong>`;
    allBtn.onclick = () => {
      const list = sensors.map(s => `${s.SensorType}: ${s.SensorName} (SensorID=${s.SensorID})`).join("\n");
      showModal(`${h.hostname} — Sensors`, list || "No sensors");
    };
    mini.appendChild(allBtn);

    t.appendChild(row);
    t.appendChild(mini);
    el.appendChild(t);
  }
}

function renderLinkTiles(){
  const el = document.getElementById("linkTiles");
  el.innerHTML = "";

  const edges = Array.from(SUBNET_EDGES.values()).sort((x,y) => {
    if (x.a_sub !== y.a_sub) return x.a_sub - y.a_sub;
    return x.b_sub - y.b_sub;
  });

  if (!edges.length){
    const t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = `<div class="linkmeta">No subnet links found. This dashboard derives links from <b>LinkState.edges[]</b> (SensorType=LinkState). If you expect links, confirm api.php is returning jsonData as an object or valid JSON string.</div>`;
    el.appendChild(t);
    return;
  }

  for (const E of edges){
    const aSub = E.a_sub;
    const bSub = E.b_sub;
    const hostsKey = E.hostsKey;
    const L = PHYS_LINKS.get(hostsKey);
    const Q = LINK_QUALITY.get(hostsKey);

    const kind = (L && String(L.kind||"FAST") === "SEMANTIC") ? "SEMANTIC" : "FAST";

    const t = document.createElement("div");
    t.className = "tile";

    const row = document.createElement("div");
    row.className = "row";

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = (kind === "SEMANTIC") ? getCss("--semantic") : getCss("--fast");

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = `${aSub} ↔ ${bSub}`;

    const ip = document.createElement("div");
    ip.className = "ip";
    ip.textContent = (kind === "SEMANTIC") ? "BullFrog LDP-1" : "FAST";

    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(ip);

    const meta = document.createElement("div");
    meta.className = "linkmeta";

    if (!L){
      meta.innerHTML = `<b>${aSub}↔${bSub}</b> has no host-edge record.`;
    } else {
      const qtxt = Q
        ? `status=${String(Q.status||"")}, score=${String(Q.score_0_100||"")}, dev=${String(Q.dev||"")}${Q.via?`, via=${String(Q.via)}`:""}`
        : `quality: (none)`;
      const ltxt = `link.dev=${String(L.dev||"")}${L.via?`, via=${String(L.via)}`:""}`;
      meta.innerHTML = `<b>${hostName(L.a)}</b> ↔ <b>${hostName(L.b)}</b><br>${qtxt}<br>${ltxt}<br>reason=${String(L.reason||"")}`;
    }

    const mini = document.createElement("div");
    mini.className = "mini";

    const detailsBtn = document.createElement("div");
    detailsBtn.className = "tag";
    detailsBtn.innerHTML = `<strong>Details</strong>`;
    detailsBtn.onclick = () => {
      showModal(`Link — ${aSub}↔${bSub}`, { link: L || null, quality: Q || null });
    };

    mini.appendChild(detailsBtn);

    t.appendChild(row);
    t.appendChild(meta);
    t.appendChild(mini);
    el.appendChild(t);
  }
}

/**********************************************************************
 * Polling
 **********************************************************************/
async function tick(){
  try{
    await buildFromSources();
  } catch(err){
    console.error(err);
    document.getElementById("status").textContent = `Error: ${err.message || String(err)}`;
    document.getElementById("hud").textContent = "—";
    draw();
  }
}

let timer = null;
function startPolling(){
  if (timer) clearInterval(timer);
  const sec = Math.max(1, Number(document.getElementById("pollSec").value || 2));
  timer = setInterval(tick, sec*1000);
}

document.getElementById("btnFit").onclick = () => { fitToScreen(NODES); draw(); };
document.getElementById("btnRefresh").onclick = () => tick();
document.getElementById("pollSec").onchange = () => startPolling();

startPolling();
tick();
</script>
