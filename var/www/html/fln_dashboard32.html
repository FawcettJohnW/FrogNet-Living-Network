<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FrogNet Living Network</title>
  <style>
    :root{
      --bg:#060a10;
      --panel:#0c1118;
      --panel2:#0a0f16;
      --card:#0e1520;
      --line:#1a2538;
      --line2:#15202e;
      --txt:#dce4ed;
      --muted:#6b7d94;
      --dim:#3d4f64;

      --semantic:#f0c038;
      --fast:#28cc6e;
      --unknown:#546478;

      --good:#28cc6e;
      --ok:#f0c038;
      --bad:#f0483e;

      --accent:#3b9eff;
      --accent-dim:rgba(59,158,255,0.12);

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
      --display: var(--sans);

      --dbglow: rgba(40,204,110,0.55);
      --dbglow2: rgba(40,204,110,0.25);

      --radius: 10px;
      --radius-lg: 14px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      background:var(--bg);
      color:var(--txt);
      font-family:var(--sans);
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
    }

    header{
      height:56px;
      padding:0 16px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:16px;
    }
    .logo{
      width:28px; height:28px;
      border-radius:7px;
      background:linear-gradient(135deg,#28cc6e 0%,#1a9e55 100%);
      display:flex; align-items:center; justify-content:center;
      font-size:15px;
      flex:0 0 auto;
      box-shadow:0 0 16px rgba(40,204,110,0.25);
    }
    .hdr-title{ display:flex; flex-direction:column; gap:1px; }
    .hdr-title h1{ font-size:15px; font-weight:700; letter-spacing:-0.3px; line-height:1.1; color:var(--txt); }
    .hdr-title h1 span{ color:var(--good); font-weight:400; }
    .hdr-sub{ font-size:10.5px; color:var(--muted); letter-spacing:0.2px; }

    .controls{ margin-left:auto; display:flex; align-items:center; gap:8px; }
    .ctl{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
    .ctl select{
      background:var(--card); border:1px solid var(--line); color:var(--txt);
      border-radius:6px; padding:5px 7px; font-size:11px; outline:none;
      font-family:var(--mono); cursor:pointer;
    }
    .ctl select:hover{ border-color:var(--dim); }
    .btn{
      background:var(--card); border:1px solid var(--line); color:var(--muted);
      border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px;
      font-family:var(--sans); font-weight:500; transition:all 0.15s;
    }
    .btn:hover{ color:var(--txt); border-color:var(--dim); background:var(--panel); }
    .btn:active{ transform:translateY(1px); }

    .status-pill{
      display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
      border:1px solid var(--line); border-radius:999px; background:var(--card);
      font-size:10.5px; font-family:var(--mono); color:var(--muted);
      max-width:480px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    }
    .status-pill::before{
      content:''; width:6px; height:6px; border-radius:50%;
      background:var(--good); flex:0 0 auto; box-shadow:0 0 6px var(--good);
    }

    .layout{ height:calc(100% - 56px); display:flex; min-height:0; }

    aside{
      width:440px; min-width:440px; background:var(--panel);
      border-right:1px solid var(--line); overflow-y:auto; overflow-x:hidden;
      scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
    }
    aside::-webkit-scrollbar{ width:5px; }
    aside::-webkit-scrollbar-track{ background:transparent; }
    aside::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:3px; }

    .section{ padding:14px; border-bottom:1px solid var(--line); }
    .section:last-child{ border-bottom:none; }
    .section-hdr{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .section-hdr h2{ font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .section-hdr .count{ font-size:10px; color:var(--dim); font-family:var(--mono); }

    .tile{
      border:1px solid var(--line); background:var(--card); border-radius:var(--radius);
      padding:10px 12px; margin-bottom:8px; transition:border-color 0.2s;
    }
    .tile:hover{ border-color:var(--dim); }
    .tile:last-child{ margin-bottom:0; }
    .tile .row{ display:flex; align-items:center; gap:10px; }
    .dot{ width:8px; height:8px; border-radius:50%; background:var(--unknown); flex:0 0 auto; }
    .tile .name{ font-weight:600; font-size:12.5px; color:var(--txt); flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .tile .ip{ font-family:var(--mono); font-size:11px; color:var(--muted); flex:0 0 auto; }

    .mini{ display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
    .tag{
      font-family:var(--mono); font-size:10px; padding:3px 7px; border-radius:5px;
      border:1px solid var(--line); background:var(--panel2); color:var(--muted);
      cursor:pointer; user-select:none; transition:all 0.15s; letter-spacing:0.2px;
    }
    .tag:hover{ border-color:var(--dim); color:var(--txt); }
    .tag strong{ color:var(--txt); font-weight:600; }

    .linkmeta{ font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.4; margin-top:6px; }
    .linkmeta b{ color:var(--txt); font-weight:600; }

    .engine-hero{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
    .engine-stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 10px; text-align:center; }
    .engine-stat .value{ font-size:22px; font-weight:700; color:var(--good); font-family:var(--mono); letter-spacing:-0.5px; }
    .engine-stat .value.warn{ color:var(--ok); }
    .engine-stat .value.bad{ color:var(--bad); }
    .engine-stat .value.accent{ color:var(--accent); }
    .engine-stat .label{ font-size:9.5px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.6px; font-weight:500; }

    .cache-bar-wrap{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:10px; }
    .cache-bar-label{ font-size:10px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
    .cache-bar-label span:last-child{ font-family:var(--mono); text-transform:none; letter-spacing:0; }
    .cache-bar{ height:14px; background:rgba(255,255,255,0.03); border-radius:4px; overflow:hidden; display:flex; }
    .cache-bar .same{ background:var(--good); height:100%; transition:width 0.4s ease; }
    .cache-bar .diff{ background:var(--ok); height:100%; transition:width 0.4s ease; }
    .cache-bar .miss{ background:var(--bad); height:100%; transition:width 0.4s ease; }
    .cache-bar .raw{ background:var(--unknown); height:100%; transition:width 0.4s ease; }
    .cache-legend{ display:flex; gap:12px; margin-top:6px; font-size:9.5px; color:var(--muted); font-family:var(--mono); }
    .cache-legend span{ display:flex; align-items:center; gap:4px; }
    .cache-legend .ldot{ width:7px; height:7px; border-radius:2px; flex:0 0 auto; }

    .sub-label{ font-size:9.5px; color:var(--dim); margin:10px 0 6px; text-transform:uppercase; letter-spacing:0.8px; font-weight:600; }

    .peer-tile{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; margin-bottom:6px; }
    .peer-tile:last-child{ margin-bottom:0; }
    .peer-hdr{ display:flex; align-items:center; gap:7px; margin-bottom:6px; }
    .peer-name{ font-weight:600; font-size:11.5px; flex:1; }
    .peer-stats{ display:flex; gap:10px; font-family:var(--mono); font-size:10px; color:var(--muted); }
    .peer-stats b{ color:var(--txt); font-weight:600; }
    .mini-bar{ height:4px; background:rgba(255,255,255,0.04); border-radius:2px; overflow:hidden; display:flex; }

    .endpoint-row{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line2); font-size:10.5px; }
    .endpoint-row:last-child{ border-bottom:none; }
    .endpoint-row .path{ flex:1; font-family:var(--mono); color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; }
    .endpoint-row .saved{ font-family:var(--mono); color:var(--good); font-weight:600; font-size:10px; }
    .endpoint-row .hits{ color:var(--muted); font-family:var(--mono); font-size:10px; }

    .daemon-row{ display:flex; align-items:center; gap:8px; padding:4px 0; font-size:10.5px; font-family:var(--mono); }
    .daemon-row .dlabel{ color:var(--muted); flex:0 0 60px; }
    .daemon-row .dbar{ flex:1; height:6px; background:rgba(255,255,255,0.04); border-radius:3px; overflow:hidden; position:relative; }
    .daemon-row .dbar-fill{ height:100%; border-radius:3px; transition:width 0.4s ease; }
    .daemon-row .dval{ flex:0 0 60px; text-align:right; color:var(--txt); font-weight:600; }

    main{
      flex:1 1 auto; position:relative; min-width:0; min-height:0;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(40,204,110,0.02) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 30%, rgba(59,158,255,0.02) 0%, transparent 60%),
        var(--bg);
    }
    canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

    .hud{ position:absolute; left:12px; bottom:12px; pointer-events:none; }
    .hud .status-pill{ pointer-events:none; }

    /* Map title — two lines, top-center of the canvas region.
       Overlays the canvas (pointer-events:none so it never eats clicks).
       Translucent pill matches the legend/HUD styling. */
    .map-title{
      position:absolute; top:14px; left:50%; transform:translateX(-50%);
      pointer-events:none; text-align:center;
      padding:14px 32px; border-radius:12px;
      background:rgba(10,15,22,0.82);
      border:1px solid var(--line);
      backdrop-filter:blur(2px);
      z-index:5;
    }
    .map-title-l1{
      font-size:30px; font-weight:700; letter-spacing:-0.4px;
      color:var(--txt); line-height:1.15;
    }
    .map-title-l2{
      font-size:23px; font-weight:500; letter-spacing:0.3px;
      color:var(--good); margin-top:5px;
    }

    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center; padding:20px; z-index:100;
    }
    .modal{
      width:min(960px, 94vw); max-height:88vh; background:var(--panel);
      border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;
      display:flex; flex-direction:column; box-shadow:0 24px 80px rgba(0,0,0,0.5);
    }
    .modal .modal-hdr{
      height:auto; padding:12px 14px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:10px; background:var(--panel);
    }
    .modal .m-title{ font-size:12.5px; font-weight:600; color:var(--txt); flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    pre{
      margin:0; padding:14px; background:var(--bg); color:var(--txt); overflow:auto;
      font-family:var(--mono); font-size:11px; line-height:1.4; white-space:pre-wrap;
      word-break:break-word; flex:1 1 auto;
    }
    #modalList{
      display:none; flex:1 1 auto; overflow-y:auto; padding:6px 0;
      background:var(--bg); scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
    }
    #modalList::-webkit-scrollbar{ width:6px; }
    #modalList::-webkit-scrollbar-track{ background:transparent; }
    #modalList::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:3px; }
    .sensor-row{
      display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer;
      border-bottom:1px solid var(--line2); transition:background 0.1s;
    }
    .sensor-row:hover{ background:var(--card); }
    .sensor-row .stype{
      font-family:var(--mono); font-size:11px; color:var(--accent);
      min-width:170px; flex:0 0 auto;
    }
    .sensor-row .sname{
      font-family:var(--mono); font-size:11.5px; color:var(--txt); flex:1;
      overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    }
    .sensor-row .sid{
      font-family:var(--mono); font-size:10.5px; color:var(--muted); flex:0 0 auto;
    }
    .sensor-empty{ padding:20px; color:var(--muted); font-size:12px; text-align:center; }
  </style>
</head>

<body>
<header>
  <div class="logo">🐸</div>
  <div class="hdr-title">
    <h1>FrogNet <span>Living Network</span></h1>
    <div class="hdr-sub">Logical map · every node to every other node · dotted = route via an intermediate host · glow = link health</div>
  </div>
  <div class="controls">
    <div class="ctl">
      <span>Poll</span>
      <select id="pollSec">
        <option value="1">1 s</option>
        <option value="2" selected>2 s</option>
        <option value="5">5 s</option>
        <option value="10">10 s</option>
      </select>
    </div>
    <button class="btn" id="btnFit">Fit</button>
    <button class="btn" id="btnRefresh">Refresh</button>
    <button class="btn" id="btnView" title="Cycle: logical map → Internet (physical) map → egress tree">Internet map</button>
    <div class="status-pill" id="status">initializing…</div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="section" id="engineSection">
      <div class="section-hdr"><h2>Semantic Engine</h2></div>
      <div id="engineTiles"><div class="linkmeta">Loading engine metrics…</div></div>
    </div>
    <div class="section">
      <div class="section-hdr">
        <h2>Network Links</h2>
        <span class="count" id="linkCount"></span>
      </div>
      <div id="linkTiles"></div>
    </div>
    <div class="section">
      <div class="section-hdr">
        <h2>Hosts</h2>
        <span class="count" id="hostCount"></span>
      </div>
      <div id="hostTiles"></div>
    </div>
  </aside>

  <main>
    <canvas id="net"></canvas>
    <div class="map-title">
      <div class="map-title-l1">The FrogNet Living Network</div>
      <div class="map-title-l2">Routing and Topology Map (Live)</div>
    </div>
    <div class="hud">
      <div class="status-pill" id="hud">—</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-hdr">
      <button class="btn" id="modalBack" style="display:none;">&larr; Back</button>
      <div class="m-title" id="modalTitle">&mdash;</div>
      <button class="btn" id="modalClose">Close</button>
    </div>
    <div id="modalList"></div>
    <pre id="modalBody"></pre>
  </div>
</div>

<script>
/**********************************************************************
 * Helpers
 **********************************************************************/
function isV4(s){ return typeof s==="string" && /^\d+\.\d+\.\d+\.\d+$/.test(s); }
function isFrogNetIp(ip){ return typeof ip==="string" && ip.startsWith("10."); }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

async function jget(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
  return await r.json();
}
async function jgetTry(urls){
  let lastErr=null;
  for(const u of urls){ try{return await jget(u);}catch(e){lastErr=e;} }
  throw lastErr||new Error("all fetch variants failed");
}

function parseEcho(echoStr){
  if(typeof echoStr!=="string") return {fqdn:"",hostPath:"",gw0:"",gw1:""};
  const parts=echoStr.trim().split(",");
  return {fqdn:(parts[0]||"").trim(),hostPath:(parts[1]||"").trim(),gw0:(parts[2]||"").trim(),gw1:(parts[3]||"").trim()};
}

function canonicalKey(a,b){ return [a,b].sort().join("|"); }
function subnetThird(ip){ if(!isV4(ip)) return null; const p=ip.split("."); return p[2]?Number(p[2]):null; }

function safeJsonParse(v){
  if(v===null||v===undefined) return null;
  if(typeof v==="object") return v;
  if(typeof v!=="string") return null;
  try{return JSON.parse(v);}catch{return null;}
}

/**********************************************************************
 * Resolve the owning host IP from the SensorName prefix.
 * SensorName is like "BlackBox.Topology.Links" — the part before the
 * first dot is the hostname.  Look it up in the hosts map to get IP.
 * Falls back to SensorAddress if the hostname isn't found.
 **********************************************************************/
function resolveHostIp(sensor, hosts){
  const name=String(sensor.SensorName||"");
  const label=name.split(".")[0];
  if(label){
    for(const [ip,h] of hosts.entries()){
      if(h.hostname===label) return ip;
    }
  }
  return String(sensor.SensorAddress||"").trim();
}

function formatBytes(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+" KB";
  if(bytes<1024*1024*1024) return (bytes/(1024*1024)).toFixed(1)+" MB";
  return (bytes/(1024*1024*1024)).toFixed(2)+" GB";
}
function formatPct(ratio){ return (ratio*100).toFixed(1)+"%"; }
function formatMs(ms){ return ms>=1000?(ms/1000).toFixed(2)+"s":ms.toFixed(1)+"ms"; }

/**********************************************************************
 * LinkState normalization
 **********************************************************************/
function normalizeEdgesFromLinkStateJson(obj){
  if(!obj||typeof obj!=="object") return [];
  if(Array.isArray(obj.edges)) return obj.edges;
  if(obj.peer_host_ip) return [obj];
  return [];
}

/**********************************************************************
 * RTT-based edge colors
 **********************************************************************/
function rttColor(rtt_ms){
  if(!rtt_ms||rtt_ms<=0) return"#546478";
  if(rtt_ms<1000) return"#3b9eff";
  if(rtt_ms<2000) return"#f0c038";
  return"#f0483e";
}
function edgeStrokeColor(e){
  if(!e) return"#546478";
  if(e.kind==="EXTERNAL") return "#9aafc8";   /* brighter than unknown-RTT gray so uplinks actually show up */
  const rtt=e.meta&&e.meta.rtt_avg_ms?Number(e.meta.rtt_avg_ms):0;
  return rttColor(rtt);
}

/**********************************************************************
 * Edge dash patterns — each maps to a route class.  Style identifies
 * the kind of route; color identifies the internet pathway (or RTT
 * for non-tunnel routes).  Keep in sync with drawLegend() and draw().
 *   []        solid    — direct/LAN route (dev != wg*, not EXTERNAL)
 *   [10,10]   dashed   — WireGuard tunnel route (dev wg*); drawn twice
 *                        in two pathway colors when both endpoints
 *                        have distinct internet gateways
 *   [8,4,2,4] dot-dash — Internet uplink (EXTERNAL); drawn in source
 *                        host's pathway color
 **********************************************************************/
const DASH_DIRECT   = [];
const DASH_TUNNEL   = [10,10];   /* slightly tighter than v23's [14,8] — interleaves cleanly with phase offset */
const DASH_UPLINK   = [8,4,2,4];
/* [LOGICAL_IS_NOT_PHYSICAL_V1] A route THROUGH another host is not a wire and
 * must not be drawn as one — in the logical view it is the majority of the
 * lines on screen. */
const DASH_TRANSIT  = [2,5];
/* [INFERRED_IS_NOT_OBSERVED_V1] filterEgressTree BFS-synthesizes hops when a
 * host's echo data is missing. v31 marked them synthetic:true and then drew
 * them identically to observed hops — the flag was set and never read. A map
 * that invents a link it cannot see is worse than one that shows a gap. */
const DASH_INFERRED = [1,4];

function edgeDash(e){
  if(!e) return DASH_DIRECT;
  if(e.meta && e.meta.synthetic) return DASH_INFERRED;
  if(e.kind==="EXTERNAL") return DASH_UPLINK;
  if(e.meta && e.meta.transit) return DASH_TRANSIT;
  const dev=(e.meta&&typeof e.meta.dev==="string")?e.meta.dev.toLowerCase():"";
  if(dev.startsWith("wg")) return DASH_TUNNEL;
  return DASH_DIRECT;
}

/**********************************************************************
 * Deterministic per-node color
 **********************************************************************/
let NODE_COLOR_MAP=new Map();
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return(h>>>0); }
function hueDist(a,b){ const d=Math.abs(a-b)%360; return Math.min(d,360-d); }

function computeUniqueNodeColors(nodeIds){
  const out=new Map();
  const ids=Array.from(nodeIds).map(id=>String(id??"").trim()).filter(id=>id&&!id.startsWith("external:")).sort();
  const MIN_GAP=20, chosenHues=[];
  for(const id of ids){
    const base=hashStr(id)%360; let h=base,picked=null;
    for(let tries=0;tries<360;tries++){
      let ok=true;
      for(const hh of chosenHues){if(hueDist(h,hh)<MIN_GAP){ok=false;break;}}
      if(ok){picked=h;break;} h=(h+37)%360;
    }
    if(picked===null) picked=base;
    chosenHues.push(picked);
    out.set(id,`hsl(${picked} 65% 52%)`);
  }
  for(const raw of nodeIds){
    const id=String(raw??"").trim();
    if(id.startsWith("external:")) out.set(id,"hsl(0 0% 88%)");
  }
  return out;
}

function assignColorIfMissing(id){
  const k=String(id??"").trim();
  if(!k) return "hsl(0 0% 55%)";
  if(k.startsWith("external:")){ NODE_COLOR_MAP.set(k,"hsl(0 0% 88%)"); return NODE_COLOR_MAP.get(k); }
  if(NODE_COLOR_MAP.has(k)) return NODE_COLOR_MAP.get(k);
  const used=new Set(NODE_COLOR_MAP.values());
  const base=hashStr(k)%360;
  const L_LANES=[52,44,60,38,66];
  let h=base;
  for(let lane=0;lane<L_LANES.length;lane++){
    const l=L_LANES[lane];
    for(let tries=0;tries<360;tries++){
      const cand=`hsl(${h} 65% ${l}%)`;
      if(!used.has(cand)){NODE_COLOR_MAP.set(k,cand);return cand;}
      h=(h+37)%360;
    }
  }
  const cand=`hsl(${base} 65% 52%)`;
  NODE_COLOR_MAP.set(k,cand);
  return cand;
}

function idNorm(id){ return String(id??"").trim(); }
function nodeColorForId(id){ return assignColorIfMissing(id); }

function parseHsl(css){
  const m=String(css||"").match(/hsl\(\s*([0-9.]+)\s+([0-9.]+)%\s+([0-9.]+)%\s*\)/i);
  if(!m) return null;
  return {h:Number(m[1]),s:Number(m[2]),l:Number(m[3])};
}
function hslToRgb(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs(((h/60)%2)-1));
  const m=l-c/2;
  let r=0,g=0,b=0;
  if(0<=h&&h<60){r=c;g=x;b=0;}
  else if(60<=h&&h<120){r=x;g=c;b=0;}
  else if(120<=h&&h<180){r=0;g=c;b=x;}
  else if(180<=h&&h<240){r=0;g=x;b=c;}
  else if(240<=h&&h<300){r=x;g=0;b=c;}
  else{r=c;g=0;b=x;}
  return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
}
function relLuma(rgb){
  function lin(u){u/=255;return(u<=0.04045)?(u/12.92):Math.pow((u+0.055)/1.055,2.4);}
  return 0.2126*lin(rgb.r)+0.7152*lin(rgb.g)+0.0722*lin(rgb.b);
}
function bestTextColorForFill(fillCss){
  const hsl=parseHsl(fillCss);
  if(!hsl) return "#0b0f14";
  const rgb=hslToRgb(hsl.h,hsl.s,hsl.l);
  return(relLuma(rgb)>0.38)?"#0b0f14":"#e8edf3";
}

/**********************************************************************
 * View transform
 **********************************************************************/
let view={x:0,y:0,k:1.0};
function worldToScreen(p){return{x:p.x*view.k+view.x,y:p.y*view.k+view.y};}
function screenToWorld(p){return{x:(p.x-view.x)/view.k,y:(p.y-view.y)/view.k};}

function fitToScreen(nodes){
  const rect=canvas.getBoundingClientRect();
  const sw=rect.width,sh=rect.height;
  const arr=Array.from(nodes.values());
  if(!arr.length) return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const n of arr){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x);maxy=Math.max(maxy,n.y);}
  const pad=160; minx-=pad;miny-=pad;maxx+=pad;maxy+=pad;
  const w=Math.max(1,maxx-minx),h=Math.max(1,maxy-miny);
  const k=Math.min(sw/w,sh/h,1.6);
  view.k=Math.max(0.25,k);
  view.x=sw/2-((minx+maxx)/2)*view.k;
  view.y=sh/2-((miny+maxy)/2)*view.k;
}

 * State
 **********************************************************************/
const EDGE_W=2.5;
let HOSTS=new Map(),SENSORS=[],SENSOR_BY_HOSTIP=new Map(),SENSOR_DATA_CACHE=new Map();
let NODES=new Map(),EDGES=new Map(),PHYS_LINKS=new Map(),LINK_QUALITY=new Map(),SUBNET_EDGES=new Map();
