     always, tiles when connected. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title><link rel="stylesheet" href="rt.css"><link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style> #map { height: 70vh; border: 1px solid #d5d9e0; border-radius: 6px; background: #e9edf2; } </style></head><body>
<nav><a href="log.html">Radio Log</a> · <a href="rangers.html">Rangers</a> · <b>Map</b> · <a href="print309.html">ICS-309</a></nav>
<h1>Map <small id="mis"></small></h1>
<div id="say"></div>
<div id="map"></div>
<table><thead><tr><th>Callsign</th><th>Where</th><th>Status</th><th>Heard</th><th>Msg #</th></tr></thead><tbody id="rows"></tbody></table>
<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module">
import * as RT from './rt.js'
const D = RT.D, $ = (s) => document.querySelector(s), say = (t) => { $('#say').textContent = t }
const m = RT.currentMission()
const map = L.map('map').setView([47.6, -122.3], 9), markers = new Map()
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' })
tiles.on('tileerror', () => say('no basemap (no Internet): positions only')); tiles.addTo(map)
const ring = ['#ffffff', '#f5e663', '#f2c14e', '#ef9a3c', '#e8702a', '#d9481c', '#b3160b']
let fitted = false
function draw(log) {
  const latest = new Map()
  for (const r of [...log.values()].sort((a, b) => a.id - b.id)) { const l = r.bag.location || {}; if (l.lat != null) latest.set(r.bag.callsign.toUpperCase(), r) }
  for (const [c, mk] of markers) if (!latest.has(c)) { mk.remove(); markers.delete(c) }
  for (const [c, r] of latest) {
    const b = r.bag, band = D.overdueBand((Date.now() - new Date(b.date)) / 60000), ll = [b.location.lat, b.location.lng]
    const style = { radius: 9, color: ring[band], weight: 3, fillColor: D.statusColor(b.status), fillOpacity: 0.9 }
    const tip = c + ' · ' + D.msgNoShort(b.msgNo) + ' · ' + new Date(b.date).toLocaleTimeString()
    if (markers.has(c)) markers.get(c).setLatLng(ll).setStyle(style).setTooltipContent(tip)
    else markers.set(c, L.circleMarker(ll, style).bindTooltip(tip, { permanent: true, direction: 'right' }).addTo(map))
  }
  if (!fitted && latest.size) { map.fitBounds([...latest.values()].map(r => [r.bag.location.lat, r.bag.location.lng]), { maxZoom: 14, padding: [30, 30] }); fitted = true }
  $('#rows').innerHTML = [...latest].sort((a, b) => a[0].localeCompare(b[0])).map(([c, r]) => { const b = r.bag
    return '<tr data-c="' + RT.esc(c) + '"><td>' + RT.esc(c) + '</td><td>' + RT.esc(D.formatLatLng(b.location.lat, b.location.lng, 'DD')) + ' · ' + RT.esc(D.maidenhead(b.location.lat, b.location.lng)) +
      '</td><td>' + RT.esc(b.status) + '</td><td>' + RT.esc(new Date(b.date).toLocaleTimeString()) + '</td><td>' + RT.esc(D.msgNoShort(b.msgNo)) + '</td></tr>' }).join('')
}
if (!m) say('choose or start a mission on the Radio Log first')
else { $('#mis').textContent = m.name + ', op period ' + m.opPeriod; RT.watch('rt-log', RT.logVariable(m), draw, (e) => say('the RAM did not answer (' + e.message + '); reading again')) }
</script></body></html>
