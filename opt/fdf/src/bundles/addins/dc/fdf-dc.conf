# fdf-dc.conf -- [DC_APPS_V1][ADDIN_V1] DisasterComm's pages at /dc/, from /opt/fdf/www/dc (the dc add-in installs both),
# under the same fdf.env as /fdf/. Their held reads each keep an Apache worker for up to 25 s.
Alias /dc/ /opt/fdf/www/dc/
<Directory /opt/fdf/www/dc>
    Options None
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>
# [RT_PAGES_V1] the radio log app (the launcher's "Radio log"), at /openeoc/ from /opt/fdf/www/openeoc; its RAM door is /dc/ram.php
Alias /openeoc/ /opt/fdf/www/openeoc/
<Directory /opt/fdf/www/openeoc>
    Options None
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    <FilesMatch "\.(py|mjs)$">
        Require all denied
    </FilesMatch>
</Directory>
