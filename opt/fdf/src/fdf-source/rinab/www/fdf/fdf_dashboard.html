<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FD&amp;F region members</title>
<!-- [FDF_DASHBOARD_V1] (plan item 7) FD&F's dashboard, modelled on FrogNet's fln_dashboard: the participants, as the shared
     space holds them. The page reads only its own server: getParticipants.php for the first view, then
     waitParticipants.php?gen=N, which returns when the set CHANGES (held in the RAM manager, no timer). No routes and no
     edges to draw: in FD&F every machine reaches the others only through the RAM manager.
     [ONE_MONITOR_TRUTH_V1 - T5] The same names as the node's pages (fln_dashboard32.html, frognet_monitor,
     getSnapshot.php): the region's machines are its members, each alive or not; the node dashboard is linked from the
     header, and it links back here. [FDF_WEB_UNDER_APACHE_V1 - T5b] On a node this page is /fdf/ of the node's own
     Apache (000-default.conf Alias /fdf/ -> /opt/fdf/www/fdf/), the same server as fln_dashboard32.html, so the link is
     a path on this server. -->
<style>
  :root { --bg:#f6f7f9; --fg:#1c2330; --muted:#5d6878; --card:#fff; --line:#dde2ea; --ok:#1b7f3b; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --fg:#e6e9ee; --muted:#98a2b3; --card:#1a2029; --line:#2a323e; --ok:#4cc27a; --bad:#ff6b5e; } }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  #status { color:var(--muted); }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  main { padding:16px 20px; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.gone td { color:var(--muted); }
  #err { color:var(--bad); margin-top:12px; white-space:pre-wrap; }
  header a { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>FD&amp;F region members</h1>
  <span id="status">connecting…</span>
  <a id="node" href="/fln_dashboard32.html">node dashboard (fln_dashboard32)</a>
</header>
<main>
  <div class="wrap">
    <table>
      <thead><tr><th>Member</th><th>Addresses</th><th>Alive</th><th>Cores</th><th>CPU benchmark</th><th>Memory (GB)</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="err"></div>
</main>
<script>
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]); }
function render(list, gen) {
  list.sort((a, b) => (b.alive - a.alive) || a.hostname.localeCompare(b.hostname));
  document.getElementById("rows").innerHTML = list.map(p =>
    `<tr class="${p.alive ? "" : "gone"}"><td>${esc(p.hostname)}</td><td>${esc((p.ips || []).join(", "))}</td>` +
    `<td class="${p.alive ? "ok" : "bad"}">${p.alive ? "yes" : "no"}</td><td class="num">${p.cores}</td>` +
    `<td class="num">${Number(p.cpu_bench_total).toFixed(0)}</td><td class="num">${(p.mem_total_kb / 1048576).toFixed(1)}</td></tr>`).join("");
  const alive = list.filter(p => p.alive).length;
  document.getElementById("status").innerHTML = `<span class="ok">Connected</span> · ${alive} alive of ${list.length} · change ${gen}`;
}
function fail(e) { document.getElementById("status").innerHTML = `<span class="bad">Disconnected</span>`; document.getElementById("err").textContent = e; }
async function get(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(url + ": HTTP " + r.status + " " + await r.text()); return r.json(); }
(async () => {
  try {
    let gen = 0; render(await get("getParticipants.php"), gen);
    for (;;) {                                          // each call returns only when the participant set has changed
      const j = await get("waitParticipants.php?gen=" + gen);
      gen = j.gen; render(j.participants, gen);
    }
  } catch (e) { fail(e.message); }
})();
</script>
</body>
</html>
