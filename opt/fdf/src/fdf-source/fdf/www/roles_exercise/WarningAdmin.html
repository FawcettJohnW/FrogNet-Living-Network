     WarningAdmin.html -- [ROLE_ADMIN_PAGES_V1] the Warning Role's admin tool and view: the grid with sensor coverage and current tracks; each sensor's status; a sensor set in or out of service.
     It reads its Role's memory, and what that Role itself reads, through held reads (roles.js watch); it redraws when
     one returns. It names memories and tuples only: no protocol and no key. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roles Exercise -- WarningAdmin</title><link rel="stylesheet" href="roles.css"></head><body>
<h1>Roles Exercise -- WarningAdmin <small id="clock"></small></h1>
<div id="say"></div>
<div class="cols"><div><div class="grid" id="grid"></div></div>
<div><h2>Sensors</h2><table id="sensors"></table><h2>Tracks <small id="step"></small></h2><table id="tracks"></table></div></div>
<script type="module">
import * as R from './roles.js'
let mine = new Map()
function draw() {
  const sensors = R.family(mine, 'sensor'), console_ = new Map(R.family(mine, 'console')), det = R.latest(mine, 'detection') || { tracks: [], sensors: {} }
  const marks = []
  for (const [n, s] of sensors) { const up = (det.sensors?.[n] || s.status) === 'ok'
    if (up) for (let x = s.x - s.range; x <= s.x + s.range; x++) for (let y = s.y - s.range; y <= s.y + s.range; y++) marks.push({ x, y, cls: 'cover', text: '' }) }
  for (const [n, s] of sensors) marks.push({ x: s.x, y: s.y, cls: (det.sensors?.[n] || s.status) === 'ok' ? 'sensor' : 'down', text: 'S' + n, title: 'sensor ' + n + ': ' + s.status })
  for (const t of det.tracks || []) marks.push({ x: t.x, y: t.y, cls: 'track', text: t.track, title: 'track ' + t.track + ', quality ' + t.quality })
  R.grid(R.$('#grid'), marks)
  R.$('#step').textContent = det.step ? 'step ' + det.step : ''
  R.table(R.$('#sensors'), ['Sensor', 'At', 'Range', 'Quality', 'Status', 'Service'], sensors.map(([n, s]) => { const out = console_.get('sensor.' + n)?.status === 'out'
    return [n, s.x + ', ' + s.y, s.range, s.quality, { html: '<span class="' + (s.status === 'ok' ? 'ok' : 'bad') + '">' + R.esc(det.sensors?.[n] || s.status) + '</span>' },
            { html: '<button data-n="' + n + '" data-to="' + (out ? 'in' : 'out') + '">' + (out ? 'put in service' : 'take out of service') + '</button>' }] }))
  R.table(R.$('#tracks'), ['Track', 'At', 'Quality', 'Sensors'], (det.tracks || []).map((t) => [t.track, t.x + ', ' + t.y, t.quality, t.sensors]))
}
R.$('#sensors').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return
  R.write('warning', 'console', 'sensor.' + b.dataset.n, b.dataset.to === 'out' ? { status: 'out' } : { off: true }) })
R.watch('warning', 'SD:%', (c) => { mine = c; draw() })
R.watch('exercise', 'SD:clock.run', (c) => { const k = c.get('clock.run'); R.$('#clock').textContent = k ? 'step ' + k.step + ', ' + k.state : '' })
</script></body></html>
