<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title><link rel="stylesheet" href="rt.css"><link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style> #map { height: 70vh; border: 1px solid #d5d9e0; border-radius: 6px; background: #e9edf2; } </style></head><body>
<nav><a href="log.html">Radio Log</a> · <a href="rangers.html">Rangers</a> · <b>Map</b> · <a href="print309.html">ICS-309</a> · <a href="board.html">Board</a> · <a href="messages.html">Messages</a></nav>
<h1>Map <small id="mis"></small></h1>
<div id="say"></div>
<div id="map"></div>
<table><thead><tr><th>Device</th><th>Where</th><th>±</th><th>Heard</th><th>Since</th></tr></thead><tbody id="rows"></tbody></table>
<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module">
import * as RT from './rt.js'
const D = RT.D, $ = (s) => document.querySelector(s), say = (t) => { $('#say').textContent = t }
window.RT_NOTE = (t) => { const e = document.querySelector('#say'); if (e) e.textContent = t }
const m = RT.currentMission()
const map = L.map('map').setView([47.6, -122.3], 9), markers = new Map()
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' })
tiles.on('tileerror', () => say('no basemap (no Internet): positions only')); tiles.addTo(map)
const ring = ['#ffffff', '#f5e663', '#f2c14e', '#ef9a3c', '#e8702a', '#d9481c', '#b3160b']
let fitted = false
let cur = new Map()
function draw(pos) {
  cur = pos
  for (const [i, mk] of markers) if (!pos.has(i)) { mk.remove(); markers.delete(i) }
  const list = [...pos].filter(([, r]) => r.bag && r.bag.lat != null).sort((a, b) => String(a[1].bag.name).localeCompare(String(b[1].bag.name)))
  for (const [i, r] of list) {
    const b = r.bag, band = D.overdueBand((Date.now() / 1000 - b.at) / 60), ll = [b.lat, b.lng]
    const style = { radius: 9, color: ring[band], weight: 3, fillColor: '#3a8f5c', fillOpacity: 0.9 }
    const tip = b.name + ' · ' + new Date(b.at * 1000).toLocaleTimeString()
    if (markers.has(i)) markers.get(i).setLatLng(ll).setStyle(style).setTooltipContent(tip)
    else markers.set(i, L.circleMarker(ll, style).bindTooltip(tip, { permanent: true, direction: 'right' }).addTo(map))
  }
  if (!fitted && list.length) { map.fitBounds(list.map(([, r]) => [r.bag.lat, r.bag.lng]), { maxZoom: 14, padding: [30, 30] }); fitted = true }
  $('#rows').innerHTML = list.map(([i, r]) => { const b = r.bag, mins = Math.max(0, Math.floor((Date.now() / 1000 - b.at) / 60))
    return '<tr data-d="' + RT.esc(i) + '"><td>' + RT.esc(b.name) + '</td><td>' + RT.esc(D.formatLatLng(b.lat, b.lng, 'DD')) + ' · ' + RT.esc(D.maidenhead(b.lat, b.lng)) +
      '</td><td>' + (b.acc != null ? Math.round(b.acc) + ' m' : '') + '</td><td>' + RT.esc(new Date(b.at * 1000).toLocaleTimeString()) + '</td><td>' + mins + ' min</td></tr>' }).join('')
}
setInterval(() => draw(cur), 30000)                             // the rings and "since" age on this page's clock
if (!m) say('choose or start a mission on the Radio Log first')
else { $('#mis').textContent = m.name + ', op period ' + m.opPeriod; RT.sharePosition(m)
       RT.watch('rt-pos', m.id, draw, (e) => say('the RAM did not answer (' + e.message + '); reading again')) }
</script></body></html>
