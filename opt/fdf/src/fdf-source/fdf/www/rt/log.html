     node. Every device's entries, as they are written; nothing merged, nothing sent. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Log</title>
<link rel="stylesheet" href="rt.css"></head><body>
<nav><b>Radio Log</b> · <a href="rangers.html">Rangers</a> · <a href="map.html">Map</a> · <a href="print309.html">ICS-309</a> · <a href="board.html">Board</a></nav>
<h1>Radio Log</h1>
<fieldset id="dev"><label>This device <input name="name" size="12" placeholder="scribe name"></label>
  <label>Station <input name="station" size="2" maxlength="1" placeholder="A"></label> <button type="button" id="saveDev">Set</button>
  <small id="devInfo"></small></fieldset>
<fieldset id="mis"><label>Mission <select name="pick"></select></label>
  <label>or start one <input name="name" size="14" placeholder="26-0142"></label><label>op period <input name="op" size="3" value="1"></label>
  <button type="button" id="startMission">Start</button> <small id="misInfo"></small></fieldset>
<form id="entry"><fieldset><label>Callsign <input name="callsign" size="10" required list="callsigns"></label><datalist id="callsigns"></datalist>
  <label>Status <select name="status"></select></label>
  <label>Location <input name="location" size="22" placeholder="47.61, -122.33 or CN87"></label>
  <label>Notes <input name="notes" size="30"></label> <button>Log it</button></fieldset></form>
<div id="say"></div>
<h2>Entries <small id="count"></small></h2>
<table><thead><tr><th>Msg #</th><th title="handled: click to cycle ✓ → !">✓</th><th>Time</th><th>Callsign</th><th>Status</th><th>Location</th><th>Notes</th><th>By</th></tr></thead><tbody id="rows"></tbody></table>
<script type="module">
import * as RT from './rt.js'
const D = RT.D, $ = (s) => document.querySelector(s), f$ = (fs, n) => $(fs + ' [name=' + n + ']'), say = (t) => { $('#say').textContent = t }
for (const [k] of D.STATUSES) $('#entry').status.add(new Option(k, k))
let entries = new Map(), stopLog = null, stopMarks = null, stopRoster = null, stopPos = null, missions = new Map(), marks = new Map()
function showDev() { const d = RT.device(); f$('#dev', 'name').value = d.name; f$('#dev', 'station').value = d.station; $('#devInfo').textContent = 'device ' + d.id + (d.station ? ', station ' + d.station : ', no station yet') }
$('#saveDev').onclick = () => { RT.setDevice(f$('#dev', 'name').value.trim(), f$('#dev', 'station').value.trim()); showDev() }
showDev()
function draw() {
  const me = RT.device().id
  const rows = [...entries.values()].sort((a, b) => a.id - b.id)               // write order
  $('#count').textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies')
  $('#rows').innerHTML = rows.map(r => { const b = r.bag, l = b.location || {}
    const where = l.lat != null ? D.formatLatLng(l.lat, l.lng, 'DD') + (l.text && !/^-?\d/.test(l.text) ? ' (' + RT.esc(l.text) + ')' : '') : RT.esc(l.text || '')
    return '<tr data-i="' + RT.esc(r.instance) + '"' + (b.dev === me ? ' class="me"' : '') + '><td class="no" title="' + RT.esc(D.msgNoFull(b.msgNo)) + '">' + RT.esc(D.msgNoShort(b.msgNo)) +
      '</td><td class="mk">' + (D.MARK_GLYPH[marks.get(r.instance)?.bag?.mark] || '') + '</td><td>' + RT.esc(new Date(b.date).toLocaleTimeString()) + '</td><td>' + RT.esc(b.callsign) + '</td><td><span class="st" style="background:' + D.statusColor(b.status) + '"></span>' + RT.esc(b.status) +
      '</td><td>' + where + '</td><td>' + RT.esc(b.notes) + '</td><td>' + RT.esc(b.by) + '</td></tr>' }).join('')
}
function open(m) {
  RT.setMission(m); $('#misInfo').textContent = 'on ' + m.name + ', op period ' + m.opPeriod
  if (stopLog) stopLog(); if (stopMarks) stopMarks(); if (stopRoster) stopRoster(); if (stopPos) stopPos()
  stopPos = RT.sharePosition(m)                             // [DEVICE_POSITION_V1] this device's own position, as it moves
  entries = new Map(); marks = new Map(); draw()
  stopRoster = RT.watch('rt-roster', m.id, (cells) => { $('#callsigns').innerHTML = [...cells.values()].map(r => '<option value="' + RT.esc(r.bag.callsign) + '">' + RT.esc(r.bag.fullName || '') + '</option>').join('') })
  stopMarks = RT.watch('rt-handled', m.id, (cells) => { marks = cells; draw() }, (e) => say('the RAM did not answer (' + e.message + '); reading again'))
  stopLog = RT.watch('rt-log', RT.logVariable(m), (cells) => { entries = cells; draw() }, (e) => say('the RAM did not answer (' + e.message + '); reading again'))
}
RT.watch('rt-mission', 'settings', (cells) => {
  missions = cells; const sel = f$('#mis', 'pick'), cur = RT.currentMission()
  sel.innerHTML = '<option value="">(choose)</option>' + [...cells.values()].map(r => '<option value="' + RT.esc(r.instance) + '">' + RT.esc(r.bag.name) + ' (op ' + RT.esc(r.bag.opPeriod) + ')</option>').join('')
  if (cur && cells.has(cur.id)) { sel.value = cur.id; if (!stopLog || cells.get(cur.id).bag.opPeriod !== cur.opPeriod) open({ id: cur.id, ...cells.get(cur.id).bag }) }
})
$('#rows').onclick = async (ev) => {                        // the handled mark: whoever marks it writes it (latest wins)
  const td = ev.target.closest('td.mk'); if (!td) return
  const i = td.parentElement.dataset.i, m = RT.currentMission(), cur = marks.get(i)?.bag?.mark
  await RT.write('rt-handled', m.id, i, { mark: D.nextMark(cur), by: RT.device().name || RT.device().id, at: Math.round(Date.now() / 1000) })
}
f$('#mis', 'pick').onchange = (e) => { const r = missions.get(e.target.value); if (r) open({ id: r.instance, ...r.bag }) }
$('#startMission').onclick = async () => {
  const name = f$('#mis', 'name').value.trim(), op = f$('#mis', 'op').value.trim() || '1'
  if (!name) { say('name the mission'); return }
  const id = RT.missionId(name)
  await RT.write('rt-mission', 'settings', id, { name, opPeriod: op, startedBy: RT.device().id, at: Math.round(Date.now() / 1000) })
  open({ id, name, opPeriod: op }); say('')
}
$('#entry').onsubmit = async (ev) => {
  ev.preventDefault(); window.RT_NOTE = (t) => { const e = document.querySelector('#say'); if (e) e.textContent = t }
const m = RT.currentMission()
  if (!m) { say('choose or start a mission first'); return }
  const f = ev.target, typed = { callsign: f.callsign.value, status: f.status.value, location: f.location.value, notes: f.notes.value }
  f.callsign.value = ''; f.notes.value = ''; f.location.value = ''; f.callsign.focus()   // the scribe types the next one now
  try { const b = await RT.logEntry(m, entries, typed); say('logged ' + D.msgNoShort(b.msgNo) + ' (' + typed.callsign + ')') }
  catch (e) { say('not logged (' + typed.callsign + '): ' + e.message)
              if (!f.callsign.value) { f.callsign.value = typed.callsign; f.notes.value = typed.notes; f.location.value = typed.location } }
}
</script></body></html>
