<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <rect width="1200" height="400" fill="#ffffff"/>
  <!-- Mark: an open ring (the room with the door open) with three linked nodes inside -->
  <g transform="translate(200,200)">
    <!-- ring, broken at the lower-right: the open door -->
    <path d="M 118.8 48.3 A 128 128 0 1 0 48.3 118.8" fill="none" stroke="#1f5e3d" stroke-width="30" stroke-linecap="round"/>
    <!-- door accent -->
    <path d="M 48.3 118.8 L 108 108 L 118.8 48.3" fill="none" stroke="#e8792b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <!-- nodes: command + two teams, linked -->
    <!-- command top, teams left/right, community bottom; all linked -->
    <line x1="0" y1="-56" x2="-56" y2="0" stroke="#1f5e3d" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="-56" x2="56" y2="0" stroke="#1f5e3d" stroke-width="14" stroke-linecap="round"/>
    <line x1="-56" y1="0" x2="0" y2="56" stroke="#1f5e3d" stroke-width="14" stroke-linecap="round"/>
    <line x1="56" y1="0" x2="0" y2="56" stroke="#1f5e3d" stroke-width="14" stroke-linecap="round"/>
    <line x1="-56" y1="0" x2="56" y2="0" stroke="#1f5e3d" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="-56" r="26" fill="#e8792b"/>
    <circle cx="-56" cy="0" r="22" fill="#1f5e3d"/>
    <circle cx="56" cy="0" r="22" fill="#1f5e3d"/>
    <circle cx="0" cy="56" r="22" fill="#1f5e3d"/>
  </g>
  <!-- Wordmark -->
  <text x="380" y="232" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="150" letter-spacing="-4">
    <tspan fill="#1f5e3d" font-weight="300">Open</tspan><tspan fill="#1f5e3d" font-weight="800">EOC</tspan>
  </text>
  <text x="386" y="300" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#6b7280" letter-spacing="2">Preparation<tspan dx="44">Management</tspan><tspan dx="44">Recovery</tspan></text>
  <text x="386" y="346" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400" fill="#6b7280">powered by the FrogNet Living Network</text>
</svg>
