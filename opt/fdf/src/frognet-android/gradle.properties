org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# [KOTLIN_IN_PROCESS_V1] Kotlin compiles inside the Gradle daemon, not a separate Kotlin daemon (Android Studio on
# Windows: "The daemon has terminated unexpectedly on startup attempt #1 with error code: 0 ... Kotlin compile daemon is ready")
kotlin.compiler.execution.strategy=in-process
