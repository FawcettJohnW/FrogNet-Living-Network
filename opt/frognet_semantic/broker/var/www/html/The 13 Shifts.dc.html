<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; }
</style>
</helmet>

<div style="position:fixed; inset:0;">
  <x-import component="ShiftsVideo" from="./shifts-video.jsx" hint-size="100%,100%" style="position:absolute; inset:0; width:100%; height:100%;"></x-import>
</div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#f3efe4"/>
    <circle cx="50" cy="50" r="9" fill="#2c5a3c"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#2c5a3c" stroke-width="1.6" opacity="0.6"/>
    <circle cx="50" cy="50" r="27" fill="none" stroke="#2c5a3c" stroke-width="1.3" opacity="0.35"/>
    <text x="50" y="84" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="9" fill="#1b1a16">13 SHIFTS</text>
  </svg>
</template>
</x-dc>
</body>
</html>
