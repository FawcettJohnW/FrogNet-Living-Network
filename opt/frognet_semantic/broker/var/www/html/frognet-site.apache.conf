# FrogNet site — served THROUGH the node's proxy + daemon (eat our own cooking)
# =============================================================================
# On a FrogNet node the proxy owns :80 and forwards local web content to the
# node's Apache at 127.0.0.1:8080 (proxy/transport_real.py: "Local upstream
# (Apache on :8080)"), handing each exchange to the :9009 semantic daemon for
# BLDC-1 / SAME / DIFF. So to put THIS site behind the proxy + daemon, it just
# has to be what the node's Apache serves on :8080. A standalone server (the
# earlier frognet_site.py) bypasses the proxy and daemon entirely — do not use
# it on a node; it is dev-only and is superseded by this vhost.
#
# Ports here are the node's, read from the RC — not invented:
#   proxy        0.0.0.0:80        (FROGNET_PROXY_LISTEN)
#   Apache       127.0.0.1:8080    (proxy upstream, _up_port default 8080)
#   daemon       127.0.0.1:9009    (semantic worker pool the proxy hands off to)
#
# Install:
#   1. Unpack the site bundle into DocumentRoot below.
#   2. Drop this file in the node's Apache conf (e.g. sites-available) and enable.
#   3. Reload Apache. The proxy is already on :80 in front of :8080 and already
#      hands exchanges to the daemon — nothing else to wire. Requests to the
#      node's :80 now serve this site over the full proxy -> daemon path.
#
# Requires: mod_headers, mod_mime, mod_proxy, mod_proxy_http, mod_rewrite.

<VirtualHost 127.0.0.1:8080>
    ServerName fawcettinnovations.com

    # >>> point this at wherever you unpack the bundle on the node <<<
    DocumentRoot /var/www/frognet-site

    DirectoryIndex index.dc.html

    <Directory /var/www/frognet-site>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # .dc.html is a double extension; serve it as HTML.
    AddType text/html .html
    <FilesMatch "\.dc\.html$">
        ForceType text/html
    </FilesMatch>

    # Build / maintenance / source: never serve, even if copied into the root.
    <FilesMatch "(?i)^(DOCTRINE|CHANGES|README)\.txt$|\.py[cd]?$">
        Require all denied
    </FilesMatch>

    # Nice URLs: /unrest-examples -> /unrest-examples.dc.html when the file exists.
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}/$1.dc.html -f
    RewriteRule ^/([^./]+)$ /$1.dc.html [L]

    # The two forms POST JSON to these routes. license_endpoint.py runs the
    # receiver (its header: "Flask app on the broker"); reverse-proxy the API to
    # wherever that receiver listens. Adjust host:port to your receiver.
    ProxyPreserveHost On
    ProxyPass        /api/  http://127.0.0.1:8137/api/
    ProxyPassReverse /api/  http://127.0.0.1:8137/api/

    # Static site content is safe to cache; the API is not.
    <LocationMatch "^/api/">
        Header set Cache-Control "no-store"
    </LocationMatch>
</VirtualHost>
