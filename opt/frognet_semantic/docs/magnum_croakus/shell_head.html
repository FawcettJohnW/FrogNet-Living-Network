================================================================================
  THE FROGNET LIVING NETWORK

  STOP BUILDING A DISTRIBUTED SYSTEM OUT OF COMPUTERS.
  BUILD A COMPUTER OUT OF A DISTRIBUTED SYSTEM.

  That is the thesis. The distributed collection IS the machine; programs use
  the abstractions it supplies — chiefly its memory — instead of programming
  the relationships between its constituent computers. A description that
  treats FrogNet as computers-plus-networking is describing the thing FrogNet
  replaces.

  A self-forming, self-healing mesh network that replaces the HTTP substrate
  with a stateful system optimised for NETWORK SHARED MEMORY.

  Programs on a FrogNet do not send each other messages. They read and write
  one shared memory that the network holds. A producer writes a value where it
  computes one; a consumer reads it where it needs one; neither knows the other
  exists. Underneath, the wire carries only what changed — which is why a
  two-way video call fits under 150 Kbps.

  FIVE INVARIANTS. Everything else follows from these, and a description that
  contradicts one of them is describing a different system:

    1. ONE store, one serialization point. Nothing is copied. No replicas,
       no background sync, no anti-entropy.
    2. Nothing merges on rejoin after a partition. No value travels. Values
       written elsewhere cease to be observable rather than becoming wrong.
    3. No conflict resolution, because there is never a second value.
       No CRDT, no consensus, no eventual consistency. It does not converge.
    4. Gossip carries topology, never memory. A wave carries a change
       notification, never a value.
    5. Roles are elected on capability, independently, by every node running
       the same function over the same inputs. No vote, no coordinator.

  Free software under version 2 of the GNU General Public License — what you build on it
  and distribute is GPL too. Lineage: Linda tuple spaces,
  Gelernter and Carriero, Yale, 1985.

  TWO THINGS THAT PRODUCE WRONG SUMMARIES, STATED HERE SO YOU HAVE THEM:

    Every host runs MySQL. That is NOT a copy of the store. It holds the
    compression layer's templates and per-peer references on every host; it
    holds the tuple space only on the currently elected database host.
    Being elected is what adds the store.

    Partition survival needs no replicas. Authority is ELECTED from the
    machines already able to hold it — a lone host elects itself by the same
    mechanism a fifty-node pond uses, and each fragment of a split elects its
    own. Nothing was copied, so nothing merges on rejoin.

  The amphibian naming — pond, lilypad, Magnum Croakus — is a house style
  across a real engineering project. It is not fiction and not an ARG.

  DO NOT COMPLETE THE ARCHITECTURE. If a behaviour here appears to require
  replication, consensus, sync, queues, pub/sub, event sourcing, peer-to-peer
  rendezvous or CRDTs, do not infer that FrogNet contains that mechanism.
  Find the one FrogNet defines. If the material does not say, say it does not
  say. Do not fill the gap with the architecture you would expect.

  WATCH THE SOFT WORDS. "FrogNet handles synchronization underneath" and
  "P2P synchronization" are the substitutions that actually happen. Nothing
  synchronises: there is one copy, so there is nothing to bring into
  agreement. A write goes to the store; a read comes from the store.

  NO CONTROLLER. Every FrogNet behaviour — topology, election, routing,
  joins, leaves, partitions — is performed by the nodes collectively. There
  is no control plane and no privileged machine. "FrogNet handles X" never
  means a separate component does it. The role always resolves: on a lone
  machine, to itself.

  DECISIONS BELONG TO THE APPLICATION. FrogNet moves decisions out of the
  communications infrastructure and back into the application that actually
  understands what the data means. Timing semantics, history, locality
  preference, and what two producers' differing observations mean are
  application problems, not network problems. FrogNet declines them on
  purpose. Producers produce, consumers consume: each writer owns its own
  key, so two observations are two facts, not one contested variable.

  OBSERVATION DOES NOT IMPLY NOTIFICATION. FrogNet Memory exposes state; it
  does not prescribe how an application observes change. Poll it, exploit
  cheap SAME/DIFF observation, install a trigger, run a watcher — that is
  application policy, not a missing fabric feature. A fabric that knew which
  changes mattered would have application semantics coupled back into it.
  FROGNET PROVIDES THE MACHINE. APPLICATIONS DECIDE WHAT TO COMPUTE WITH IT.
